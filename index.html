<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Drone Studio" />
  <meta name="theme-color" content="#0e1a14" />
  <title>Drone Studio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0e1a14;
      color: #d9e8c9;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button,
    label {
      font: inherit;
    }

    #app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 20% 10%, rgba(130, 190, 110, 0.12), transparent 24%),
        radial-gradient(circle at 80% 60%, rgba(120, 88, 55, 0.14), transparent 28%),
        linear-gradient(180deg, #0e1a14 0%, #08120d 100%);
    }

    #top {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(8, 18, 10, 0.97);
      border-bottom: 0.5px solid rgba(90, 140, 80, 0.18);
      min-height: 52px;
      z-index: 10;
    }

    #dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(90, 140, 80, 0.25);
      flex-shrink: 0;
      transition: background 0.3s;
    }

    #dot.on {
      background: rgba(155, 210, 120, 0.9);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.85); opacity: 0.35; }
    }

    #statusText {
      flex: 1;
      min-width: 0;
    }

    #statusLabel {
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: rgba(160, 210, 135, 0.45);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #nowPlaying {
      font-size: 13px;
      color: #d9e8c9;
      display: none;
      font-style: italic;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #controls {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    #timer {
      font-size: 11px;
      color: rgba(170, 220, 140, 0.4);
      font-variant-numeric: tabular-nums;
      display: none;
      min-width: 72px;
      text-align: right;
    }

    .pillButton {
      font-size: 10px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 6px 11px;
      border-radius: 999px;
      cursor: pointer;
      border: 0.5px solid rgba(90, 140, 80, 0.22);
      background: rgba(90, 140, 80, 0.06);
      color: rgba(170, 220, 140, 0.65);
      -webkit-appearance: none;
      transition: all 0.2s;
    }

    .pillButton:hover {
      background: rgba(90, 140, 80, 0.12);
      color: rgba(205, 245, 175, 0.95);
    }

    .pillButton.on {
      color: #b9e492;
      border-color: rgba(130, 190, 95, 0.5);
      background: rgba(90, 140, 80, 0.13);
    }

    #stopButton {
      color: #d5a077;
      border-color: rgba(160, 110, 70, 0.28);
      background: rgba(150, 80, 50, 0.08);
      display: none;
    }

    #stopButton.on {
      display: block;
    }

    #scene {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    #visualizer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.9;
    }

    #panel {
      position: relative;
      z-index: 2;
      width: min(720px, 100%);
      border: 1px solid rgba(180, 225, 145, 0.12);
      background: rgba(8, 18, 10, 0.68);
      backdrop-filter: blur(10px);
      box-shadow: 0 30px 120px rgba(0, 0, 0, 0.35);
      border-radius: 28px;
      padding: 22px;
    }

    #titleBlock {
      margin-bottom: 18px;
    }

    #eyebrow {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(170, 220, 140, 0.45);
      margin-bottom: 7px;
    }

    h1 {
      font-size: clamp(26px, 5vw, 48px);
      line-height: 0.95;
      letter-spacing: -0.05em;
      color: #e6efd8;
      font-weight: 600;
    }

    #instructions {
      margin-top: 10px;
      max-width: 52ch;
      font-size: 13px;
      line-height: 1.45;
      color: rgba(220, 238, 205, 0.64);
    }

    #scaleGrid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
    }

    .scaleCard {
      min-width: 0;
    }

    .scaleButton {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 22px;
      border: 1px solid rgba(170, 220, 140, 0.14);
      background:
        radial-gradient(circle at 35% 20%, rgba(230, 255, 190, 0.14), transparent 30%),
        rgba(95, 120, 75, 0.11);
      color: #dceacb;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      transition: transform 0.18s, border-color 0.18s, background 0.18s, box-shadow 0.18s;
    }

    .scaleButton:hover {
      transform: translateY(-2px);
      border-color: rgba(190, 240, 150, 0.34);
      background:
        radial-gradient(circle at 35% 20%, rgba(230, 255, 190, 0.2), transparent 30%),
        rgba(115, 145, 85, 0.16);
    }

    .scaleButton.active {
      border-color: rgba(190, 240, 150, 0.78);
      box-shadow: 0 0 0 1px rgba(190, 240, 150, 0.12), 0 20px 60px rgba(145, 200, 95, 0.18);
      background:
        radial-gradient(circle at 35% 20%, rgba(240, 255, 200, 0.28), transparent 30%),
        rgba(125, 175, 88, 0.24);
    }

    .scaleLetter {
      font-size: clamp(24px, 5vw, 42px);
      line-height: 1;
      font-weight: 600;
    }

    .scaleName {
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(220, 238, 205, 0.6);
    }

    .fileLabel {
      margin-top: 7px;
      display: block;
      width: 100%;
      cursor: pointer;
      font-size: 9px;
      line-height: 1.2;
      text-align: center;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: rgba(210, 230, 190, 0.42);
      border: 0.5px solid rgba(170, 220, 140, 0.11);
      background: rgba(255, 255, 255, 0.03);
      border-radius: 999px;
      padding: 6px 7px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fileLabel.loaded {
      color: rgba(205, 245, 175, 0.82);
      border-color: rgba(170, 220, 140, 0.24);
      background: rgba(120, 170, 90, 0.1);
    }

    .fileInput {
      display: none;
    }

    #bottom {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 14px;
      background: rgba(8, 18, 10, 0.97);
      border-top: 0.5px solid rgba(90, 140, 80, 0.1);
      min-height: 42px;
      z-index: 10;
    }

    #hint,
    #hoverLabel {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(160, 210, 135, 0.35);
    }

    #hoverLabel {
      text-align: right;
    }

    @media (max-width: 720px) {
      #scene {
        padding: 12px;
      }

      #panel {
        border-radius: 22px;
        padding: 16px;
      }

      #scaleGrid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .scaleButton {
        border-radius: 18px;
      }

      #top {
        align-items: flex-start;
      }

      #controls {
        flex-wrap: wrap;
        justify-content: flex-end;
      }
    }

    @media (max-width: 430px) {
      #scaleGrid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      #timer {
        display: none !important;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <header id="top">
      <div id="dot"></div>
      <div id="statusText">
        <div id="statusLabel">Load audio or tap a scale</div>
        <div id="nowPlaying"></div>
      </div>
      <div id="controls">
        <span id="timer"></span>
        <button class="pillButton" id="sustainButton" type="button">Sustain</button>
        <button class="pillButton" id="stopButton" type="button">Stop</button>
      </div>
    </header>

    <main id="scene">
      <canvas id="visualizer"></canvas>

      <section id="panel" aria-label="Drone scale player">
        <div id="titleBlock">
          <div id="eyebrow">Drone Studio</div>
          <h1>Seven Scale Player</h1>
          <p id="instructions">
            Click a scale button to play its matching audio file. Use the small “choose file” pills to test local files, or replace the file paths in <code>AUDIO_PATHS</code> for a deployed version.
          </p>
        </div>

        <div id="scaleGrid"></div>
      </section>
    </main>

    <footer id="bottom">
      <span id="hint">One scale plays at a time</span>
      <span id="hoverLabel"></span>
    </footer>
  </div>

  <script>
    'use strict';

    /*****************************************************************
     * 1. PUT YOUR 7 AUDIO FILES HERE
     *
     * For a deployed website, place your audio files in an /audio folder
     * beside this HTML file and update these paths.
     *
     * Example folder:
     *   index.html
     *   audio/a-minor.mp3
     *   audio/b-minor.mp3
     *   audio/c-minor.mp3
     *   audio/d-minor.mp3
     *   audio/e-minor.mp3
     *   audio/f-minor.mp3
     *   audio/g-minor.mp3
     *****************************************************************/
    const AUDIO_PATHS = [
      'audio/a-minor.mp3',
      'audio/b-minor.mp3',
      'audio/c-minor.mp3',
      'audio/d-minor.mp3',
      'audio/e-minor.mp3',
      'audio/f-minor.mp3',
      'audio/g-minor.mp3'
    ];

    /*****************************************************************
     * 2. SCALE LABELS
     *
     * These match the audio paths above by index:
     * A MINOR uses AUDIO_PATHS[0], B MINOR uses AUDIO_PATHS[1], etc.
     *****************************************************************/
    const SCALES = [
      { note: 'A', label: 'A MINOR' },
      { note: 'B', label: 'B MINOR' },
      { note: 'C', label: 'C MINOR' },
      { note: 'D', label: 'D MINOR' },
      { note: 'E', label: 'E MINOR' },
      { note: 'F', label: 'F MINOR' },
      { note: 'G', label: 'G MINOR' }
    ];

    const CROSSFADE_SECONDS = 2.5;
    const RESTART_FADE_SECONDS = 0.4;
    const SESSION_LENGTH_SECONDS = 10 * 60;

    let audioContext = null;
    let analyser = null;
    let currentSource = null;
    let currentGain = null;
    let currentScaleIndex = -1;
    let isFading = false;
    let sustain = false;
    let startedAt = null;
    let timerInterval = null;
    let animationFrame = null;

    const decodedBuffers = new Map();
    const localFiles = new Map();

    const scaleGrid = document.getElementById('scaleGrid');
    const dot = document.getElementById('dot');
    const statusLabel = document.getElementById('statusLabel');
    const nowPlaying = document.getElementById('nowPlaying');
    const timer = document.getElementById('timer');
    const stopButton = document.getElementById('stopButton');
    const sustainButton = document.getElementById('sustainButton');
    const hoverLabel = document.getElementById('hoverLabel');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');

    function initAudio() {
      if (audioContext) return;

      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioContext = new AudioContextClass();

      analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.86;
      analyser.connect(audioContext.destination);
    }

    async function getAudioBuffer(index) {
      initAudio();

      const localFile = localFiles.get(index);
      const cacheKey = localFile
        ? `local:${index}:${localFile.name}:${localFile.size}:${localFile.lastModified}`
        : `path:${AUDIO_PATHS[index]}`;

      if (decodedBuffers.has(cacheKey)) {
        return decodedBuffers.get(cacheKey);
      }

      let arrayBuffer;

      if (localFile) {
        arrayBuffer = await localFile.arrayBuffer();
      } else {
        const response = await fetch(AUDIO_PATHS[index]);

        if (!response.ok) {
          throw new Error(`Could not load ${AUDIO_PATHS[index]}`);
        }

        arrayBuffer = await response.arrayBuffer();
      }

      const decoded = await audioContext.decodeAudioData(arrayBuffer);
      decodedBuffers.set(cacheKey, decoded);
      return decoded;
    }

    async function playScale(index) {
      if (isFading) return;

      initAudio();

      if (audioContext.state === 'suspended') {
        await audioContext.resume();
      }

      let buffer;

      try {
        setLoadingState(index);
        buffer = await getAudioBuffer(index);
      } catch (error) {
        console.error(error);
        setErrorState(index, error);
        return;
      }

      const sameScale = index === currentScaleIndex;
      const fadeDuration = sameScale ? RESTART_FADE_SECONDS : CROSSFADE_SECONDS;

      isFading = true;

      const nextGain = audioContext.createGain();
      nextGain.gain.setValueAtTime(0, audioContext.currentTime);
      nextGain.connect(analyser);

      const nextSource = audioContext.createBufferSource();
      nextSource.buffer = buffer;
      nextSource.loop = sustain;
      nextSource.connect(nextGain);

      if (currentGain && currentSource) {
        currentGain.gain.cancelScheduledValues(audioContext.currentTime);
        currentGain.gain.setValueAtTime(currentGain.gain.value, audioContext.currentTime);
        currentGain.gain.linearRampToValueAtTime(0, audioContext.currentTime + fadeDuration);

        const oldSource = currentSource;
        const oldGain = currentGain;

        window.setTimeout(() => {
          try { oldSource.stop(); } catch (error) {}
          try { oldGain.disconnect(); } catch (error) {}
        }, (fadeDuration + 0.25) * 1000);
      }

      nextGain.gain.linearRampToValueAtTime(1, audioContext.currentTime + fadeDuration);
      nextSource.start(0);

      currentSource = nextSource;
      currentGain = nextGain;
      currentScaleIndex = index;

      setPlayingState(index);
      startTimer();
      drawVisualizer();

      window.setTimeout(() => {
        isFading = false;
      }, fadeDuration * 1000);

      nextSource.onended = () => {
        if (currentSource === nextSource && !sustain) {
          stopAudio();
        }
      };
    }

    function stopAudio() {
      if (currentSource) {
        try { currentSource.stop(); } catch (error) {}
      }

      if (currentGain) {
        try { currentGain.disconnect(); } catch (error) {}
      }

      currentSource = null;
      currentGain = null;
      currentScaleIndex = -1;
      isFading = false;
      startedAt = null;

      stopTimer();
      setIdleState();
    }

    function setLoadingState(index) {
      statusLabel.textContent = 'Loading audio';
      nowPlaying.textContent = SCALES[index].label;
      nowPlaying.style.display = 'block';
    }

    function setPlayingState(index) {
      dot.classList.add('on');
      statusLabel.textContent = 'Now playing';
      nowPlaying.textContent = SCALES[index].label;
      nowPlaying.style.display = 'block';
      timer.style.display = 'inline';
      stopButton.classList.add('on');

      document.querySelectorAll('.scaleButton').forEach((button, buttonIndex) => {
        button.classList.toggle('active', buttonIndex === index);
      });
    }

    function setIdleState() {
      dot.classList.remove('on');
      statusLabel.textContent = 'Load audio or tap a scale';
      nowPlaying.style.display = 'none';
      nowPlaying.textContent = '';
      timer.style.display = 'none';
      timer.textContent = '';
      stopButton.classList.remove('on');

      document.querySelectorAll('.scaleButton').forEach((button) => {
        button.classList.remove('active');
      });
    }

    function setErrorState(index, error) {
      dot.classList.remove('on');
      statusLabel.textContent = 'Audio file missing or unreadable';
      nowPlaying.textContent = `${SCALES[index].label}: ${AUDIO_PATHS[index]}`;
      nowPlaying.style.display = 'block';
      stopButton.classList.remove('on');
      isFading = false;
    }

    function startTimer() {
      stopTimer();
      startedAt = Date.now();

      function updateTimer() {
        const elapsedSeconds = Math.floor((Date.now() - startedAt) / 1000);
        const minutes = Math.floor(elapsedSeconds / 60);
        const seconds = elapsedSeconds % 60;
        const totalMinutes = Math.floor(SESSION_LENGTH_SECONDS / 60);

        timer.textContent = `${minutes}:${String(seconds).padStart(2, '0')} / ${totalMinutes}:00`;
      }

      updateTimer();
      timerInterval = window.setInterval(updateTimer, 1000);
    }

    function stopTimer() {
      if (timerInterval) {
        window.clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function buildScaleUI() {
      SCALES.forEach((scale, index) => {
        const card = document.createElement('div');
        card.className = 'scaleCard';

        const button = document.createElement('button');
        button.className = 'scaleButton';
        button.type = 'button';
        button.setAttribute('aria-label', `Play ${scale.label}`);
        button.innerHTML = `
          <span class="scaleLetter">${scale.note}</span>
          <span class="scaleName">${scale.label}</span>
        `;

        button.addEventListener('click', () => playScale(index));
        button.addEventListener('mouseenter', () => {
          hoverLabel.textContent = scale.label;
        });
        button.addEventListener('mouseleave', () => {
          hoverLabel.textContent = '';
        });

        const fileInput = document.createElement('input');
        fileInput.className = 'fileInput';
        fileInput.type = 'file';
        fileInput.accept = 'audio/*';
        fileInput.id = `file-${index}`;

        const fileLabel = document.createElement('label');
        fileLabel.className = 'fileLabel';
        fileLabel.setAttribute('for', fileInput.id);
        fileLabel.textContent = 'Choose file';
        fileLabel.title = `Optional local file for ${scale.label}`;

        fileInput.addEventListener('change', () => {
          const file = fileInput.files && fileInput.files[0];
          if (!file) return;

          localFiles.set(index, file);
          fileLabel.textContent = file.name;
          fileLabel.classList.add('loaded');

          if (currentScaleIndex === index) {
            stopAudio();
          }
        });

        card.appendChild(button);
        card.appendChild(fileLabel);
        card.appendChild(fileInput);
        scaleGrid.appendChild(card);
      });
    }

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.floor(canvas.clientWidth * ratio);
      canvas.height = Math.floor(canvas.clientHeight * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    function drawBackground(time = 0) {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      ctx.clearRect(0, 0, width, height);

      const gradient = ctx.createRadialGradient(
        width * 0.5,
        height * 0.5,
        10,
        width * 0.5,
        height * 0.5,
        Math.max(width, height) * 0.7
      );

      gradient.addColorStop(0, 'rgba(40, 68, 38, 0.34)');
      gradient.addColorStop(0.45, 'rgba(16, 31, 20, 0.7)');
      gradient.addColorStop(1, 'rgba(5, 12, 8, 1)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.globalAlpha = 0.13;
      ctx.strokeStyle = 'rgba(210, 235, 180, 0.5)';
      ctx.lineWidth = 1;

      for (let i = 0; i < 26; i++) {
        const y = (height / 26) * i;
        const offset = Math.sin(time * 0.00025 + i * 0.8) * 20;

        ctx.beginPath();
        ctx.moveTo(-20, y + offset);

        for (let x = -20; x <= width + 20; x += 40) {
          ctx.lineTo(x, y + offset + Math.sin(x * 0.012 + time * 0.0005 + i) * 10)
