<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Drone Studio</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drone Studio">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;background:#050508;overflow:hidden;}
  canvas{display:block;touch-action:none;}
  #info{
    position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);
    font-family:'Georgia',serif;font-size:.82rem;letter-spacing:.18em;
    color:#c8a96e;text-align:center;pointer-events:none;
    text-transform:uppercase;opacity:.9;
  }
  #load-status{
    position:fixed;top:1.2rem;right:1.2rem;
    font-family:'Georgia',serif;font-size:.7rem;letter-spacing:.12em;
    color:#6a7a5a;text-align:right;pointer-events:none;
    text-transform:uppercase;line-height:1.6;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">select a scale</div>
<div id="load-status" id="ls"></div>

<script>
// ─── SCALES ────────────────────────────────────────────────────────────────
const SCALES = [
  {n:'A',maj:true }, {n:'B',maj:true }, {n:'C',maj:true }, {n:'D',maj:true },
  {n:'E',maj:true }, {n:'F',maj:true }, {n:'G',maj:true },
  {n:'A',maj:false}, {n:'B',maj:false}, {n:'C',maj:false}, {n:'D',maj:false},
  {n:'E',maj:false}, {n:'F',maj:false}, {n:'G',maj:false},
];

// ─── FILE MAP ────────────────────────────────────────────────────────────────
// Edit these paths to match your actual audio filenames in the /audio/ folder.
const FILE_MAP = {
  'A-major':'audio/a-major.mp3',
  'B-major':'audio/b-major.mp3',
  'C-major':'audio/c-major.mp3',
  'D-major':'audio/d-major.mp3',
  'E-major':'audio/e-major.mp3',
  'F-major':'audio/f-major.mp3',
  'G-major':'audio/g-major.mp3',
  'A-minor':'audio/a-minor.mp3',
  'B-minor':'audio/b-minor.mp3',
  'C-minor':'audio/c-minor.mp3',
  'D-minor':'audio/d-minor.mp3',
  'E-minor':'audio/e-minor.mp3',
  'F-minor':'audio/f-minor.mp3',
  'G-minor':'audio/g-minor.mp3',
};

function scaleKey(s){ return s.n+'-'+(s.maj?'major':'minor'); }

// ─── AUDIO ENGINE ────────────────────────────────────────────────────────────
let actx = null;
const buffers   = {};   // key → AudioBuffer
const loaded    = {};   // key → bool
const ls        = document.getElementById('load-status');

let currentSrc  = null; // currently playing BufferSourceNode
let currentGain = null; // gain for current
let currentKey  = null;
const FADE = 2.5;       // crossfade seconds

function getActx(){
  if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
  return actx;
}

async function loadOne(key){
  const url = FILE_MAP[key];
  if(!url) return;
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error(res.status);
    const ab  = await res.arrayBuffer();
    const ctx = getActx();
    buffers[key] = await ctx.decodeAudioData(ab);
    loaded[key]  = true;
    updateStatus();
  } catch(e){
    // File not found or not uploaded yet — pad remains dim
    loaded[key] = false;
    updateStatus();
  }
}

function updateStatus(){
  const n = Object.values(loaded).filter(Boolean).length;
  const t = SCALES.length;
  ls.textContent = n+' / '+t+' scales loaded';
  if(n===t) setTimeout(()=>{ ls.style.opacity='0'; }, 2000);
}

function loadAll(){
  SCALES.forEach(s => loadOne(scaleKey(s)));
}

function play(i){
  const key = scaleKey(SCALES[i]);
  if(!buffers[key]) return;          // not loaded yet
  if(key === currentKey) return;     // already playing

  const ctx  = getActx();
  const now  = ctx.currentTime;

  // Fade out current
  if(currentGain){
    currentGain.gain.setValueAtTime(currentGain.gain.value, now);
    currentGain.gain.linearRampToValueAtTime(0, now + FADE);
    const dying = currentSrc;
    setTimeout(()=>{ try{ dying.stop(); }catch(_){} }, (FADE+0.1)*1000);
  }

  // Fade in new
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(1, now + FADE);
  gain.connect(ctx.destination);

  const src  = ctx.createBufferSource();
  src.buffer = buffers[key];
  src.loop   = false;   // 10-min files — no loop needed
  src.connect(gain);
  src.start(now);

  currentSrc  = src;
  currentGain = gain;
  currentKey  = key;
}

function stop(){
  if(!currentGain) return;
  const ctx = getActx();
  const now = ctx.currentTime;
  currentGain.gain.setValueAtTime(currentGain.gain.value, now);
  currentGain.gain.linearRampToValueAtTime(0, now + FADE);
  const dying = currentSrc;
  setTimeout(()=>{ try{ dying.stop(); }catch(_){} }, (FADE+0.1)*1000);
  currentSrc = null; currentGain = null; currentKey = null;
}

// ─── CANVAS / VISUAL ─────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const wx     = canvas.getContext('2d');
const info   = document.getElementById('info');

// Pad geometry
const COLS=7, ROWS=2;
let W,H,cw,ch,padR,padW,padH,startX,startY;

function resize(){
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  padW = W / COLS;
  padH = H / ROWS;
  padR = Math.min(padW, padH) * 0.36;
  cw   = padW * 0.5;
  ch   = padH * 0.5;
  startX = 0;
  startY = 0;
}

// Color palette — warm gold/amber for major, cool indigo/violet for minor
const MAJ_COLORS = ['#d4a84b','#c8973d','#e8b84b','#b8962e','#dbb040','#c49030','#f0c060'];
const MIN_COLORS = ['#6a7abf','#7a6aaf','#5a8abf','#8a6abf','#4a7aaf','#7a8acf','#5a6abf'];

let activeIdx  = -1;
let hoveredIdx = -1;
let streamPhase = 0;  // algae animation phase

// Algae / pool state per pad
const algae = SCALES.map(()=>({
  rippleT: 0,
  streams: Array.from({length:9},(_,j)=>({
    phase: Math.random()*Math.PI*2,
    amp:   0.18 + Math.random()*0.14,
    speed: 0.008 + Math.random()*0.006,
    width: 0.7  + Math.random()*0.7,
  })),
}));

function padColor(i){
  const s = SCALES[i];
  return s.maj ? MAJ_COLORS[i % 7] : MIN_COLORS[i % 7];
}

function padCenter(i){
  const col = i % COLS;
  const row = Math.floor(i / COLS);
  return {
    x: startX + col * padW + cw,
    y: startY + row * padH + ch,
  };
}

function hit(px,py){
  for(let i=0;i<SCALES.length;i++){
    const {x,y} = padCenter(i);
    const dx=px-x, dy=py-y;
    if(dx*dx+dy*dy <= padR*padR) return i;
  }
  return -1;
}

// ─── DRAW ─────────────────────────────────────────────────────────────────────
function drawPad(i, t){
  const {x,y}  = padCenter(i);
  const s      = SCALES[i];
  const col    = padColor(i);
  const isAct  = (i === activeIdx);
  const isHov  = (i === hoveredIdx);
  const ag     = algae[i];
  const hasAudio = loaded[scaleKey(s)];

  // Availability dimming
  const avail  = hasAudio ? 1 : 0.38;

  wx.save();
  wx.globalAlpha = avail * (isAct ? 1 : isHov ? 0.82 : 0.62);

  // ── Pool / circle background ──
  const grad = wx.createRadialGradient(x, y, 0, x, y, padR);
  if(isAct){
    grad.addColorStop(0,   col+'ff');
    grad.addColorStop(0.5, col+'99');
    grad.addColorStop(1,   col+'22');
  } else {
    grad.addColorStop(0,   col+'44');
    grad.addColorStop(0.6, col+'22');
    grad.addColorStop(1,   col+'08');
  }
  wx.beginPath();
  wx.arc(x, y, padR, 0, Math.PI*2);
  wx.fillStyle = grad;
  wx.fill();

  // ── Algae streams (stretched sinusoidal fills) ──
  wx.save();
  wx.beginPath();
  wx.arc(x, y, padR*0.88, 0, Math.PI*2);
  wx.clip();

  const numStreams = ag.streams.length;
  const stripeH   = (padR * 2.2) / numStreams;

  ag.streams.forEach((st, j) => {
    const baseY = y - padR*1.1 + j * stripeH;
    const pts = 40;
    wx.beginPath();
    for(let k=0; k<=pts; k++){
      const px2 = x - padR + (k/pts)*(padR*2);
      const wave = Math.sin(k/pts * Math.PI*3 + st.phase + t*st.speed*60) * padR * st.amp;
      const py2  = baseY + wave;
      k===0 ? wx.moveTo(px2,py2) : wx.lineTo(px2,py2);
    }
    // close the stripe downward
    for(let k=pts; k>=0; k--){
      const px2 = x - padR + (k/pts)*(padR*2);
      const wave = Math.sin(k/pts * Math.PI*3 + st.phase + t*st.speed*60) * padR * st.amp;
      const py2  = baseY + wave + stripeH * st.width;
      wx.lineTo(px2,py2);
    }
    wx.closePath();
    wx.fillStyle = col+(isAct?'50':'28');
    wx.fill();
  });
  wx.restore();

  // ── Ripple rings (active only) ──
  if(isAct){
    ag.rippleT = (ag.rippleT + 0.012) % 1;
    for(let r=0;r<3;r++){
      const rph = (ag.rippleT + r/3) % 1;
      wx.beginPath();
      wx.arc(x, y, padR * 0.2 + padR * 0.7 * rph, 0, Math.PI*2);
      wx.strokeStyle = col+(Math.floor((1-rph)*60).toString(16).padStart(2,'0'));
      wx.lineWidth   = 1.1 * (1-rph);
      wx.stroke();
    }
  }

  // ── Art Deco outer ring ──
  wx.beginPath();
  wx.arc(x, y, padR, 0, Math.PI*2);
  wx.strokeStyle = col+(isAct?'cc':'55');
  wx.lineWidth   = isAct ? 1.8 : 0.9;
  wx.stroke();

  // ── Sunburst spokes ──
  const spokes = 24;
  wx.save();
  wx.translate(x,y);
  for(let k=0;k<spokes;k++){
    const ang = (k/spokes)*Math.PI*2;
    const inner = padR*0.72, outer = padR*(k%3===0?0.96:0.88);
    wx.beginPath();
    wx.moveTo(Math.cos(ang)*inner, Math.sin(ang)*inner);
    wx.lineTo(Math.cos(ang)*outer, Math.sin(ang)*outer);
    wx.strokeStyle = col+(isAct?'99':'40');
    wx.lineWidth   = k%3===0 ? 1.1 : 0.5;
    wx.stroke();
  }
  wx.restore();

  // ── Chevron tick marks (outer band) ──
  wx.save();
  wx.translate(x,y);
  const ticks = 48;
  for(let k=0;k<ticks;k++){
    const ang  = (k/ticks)*Math.PI*2;
    const len  = k%4===0 ? padR*0.09 : padR*0.04;
    const dist = padR*1.06;
    wx.beginPath();
    wx.moveTo(Math.cos(ang)*dist,       Math.sin(ang)*dist);
    wx.lineTo(Math.cos(ang)*(dist+len), Math.sin(ang)*(dist+len));
    wx.strokeStyle = col+(isAct?'88':'33');
    wx.lineWidth   = 0.7;
    wx.stroke();
  }
  wx.restore();

  // ── Cog teeth ──
  const teeth = 18, toothD = padR*1.14;
  wx.save();
  wx.translate(x,y);
  wx.beginPath();
  for(let k=0;k<teeth;k++){
    const a1 = (k/teeth)*Math.PI*2 - Math.PI/(teeth);
    const a2 = a1 + Math.PI/(teeth);
    const am = (a1+a2)/2;
    wx.moveTo(Math.cos(a1)*toothD,         Math.sin(a1)*toothD);
    wx.lineTo(Math.cos(am)*(toothD+padR*.05), Math.sin(am)*(toothD+padR*.05));
    wx.lineTo(Math.cos(a2)*toothD,         Math.sin(a2)*toothD);
  }
  wx.strokeStyle = col+(isAct?'77':'28');
  wx.lineWidth   = 0.9;
  wx.stroke();
  wx.restore();

  // ── Inner cross lines ──
  wx.save();
  wx.translate(x,y);
  wx.globalAlpha *= 0.3;
  for(let k=0;k<4;k++){
    const ang = (k/4)*Math.PI*2;
    wx.beginPath();
    wx.moveTo(0,0);
    wx.lineTo(Math.cos(ang)*padR*0.55, Math.sin(ang)*padR*0.55);
    wx.strokeStyle = col;
    wx.lineWidth   = 0.5;
    wx.stroke();
  }
  wx.restore();

  // ── Algae width lines ──
  const widthT = padR / 120;
  wx.save();
  wx.translate(x,y);
  wx.globalAlpha *= 0.55;
  const numL = 7;
  for(let l=0;l<numL;l++){
    const oy = -padR*0.5 + l*(padR/numL);
    const phase2 = streamPhase + l*0.4;
    wx.beginPath();
    const steps=32;
    for(let k=0;k<=steps;k++){
      const lx = -padR*0.7 + k*(padR*1.4/steps);
      const ly = oy + Math.sin(k/steps*Math.PI*2+phase2)*padR*0.11;
      k===0?wx.moveTo(lx,ly):wx.lineTo(lx,ly);
    }
    wx.strokeStyle = col;
    wx.lineWidth   = Math.max(.22, 1.32*widthT);
    wx.stroke();
  }
  wx.restore();

  // ── Label ──
  wx.globalAlpha = avail;
  wx.font        = `${Math.round(padR*0.22)}px Georgia,serif`;
  wx.fillStyle   = col+(isAct?'ff':'bb');
  wx.textAlign   = 'center';
  wx.textBaseline= 'middle';
  wx.letterSpacing = '0.08em';
  wx.fillText(s.n + ' ' + (s.maj?'Maj':'Min'), x, y);

  // ── Unavailable indicator ──
  if(!hasAudio){
    wx.font      = `${Math.round(padR*0.13)}px Georgia,serif`;
    wx.fillStyle = '#555566';
    wx.fillText('no file', x, y + padR*0.28);
  }

  wx.restore();
}

function drawBg(){
  wx.fillStyle = '#050508';
  wx.fillRect(0,0,W,H);

  // Subtle grid lines
  wx.strokeStyle = '#1a1a28';
  wx.lineWidth   = 0.5;
  for(let c=1;c<COLS;c++){
    wx.beginPath();
    wx.moveTo(startX+c*padW,0);
    wx.lineTo(startX+c*padW,H);
    wx.stroke();
  }
  wx.beginPath();
  wx.moveTo(0, startY+padH);
  wx.lineTo(W, startY+padH);
  wx.stroke();
}

let last=0;
function loop(t=0){
  requestAnimationFrame(loop);
  streamPhase += 0.009;
  const dt = Math.min((t-last)/1000, 0.05);
  last = t;

  drawBg();
  for(let i=0;i<SCALES.length;i++) drawPad(i,t/1000);
}

// ─── INTERACTION ──────────────────────────────────────────────────────────────
canvas.addEventListener('mousemove', e=>{
  hoveredIdx = hit(e.clientX,e.clientY);
  if(hoveredIdx>=0){
    const s=SCALES[hoveredIdx];
    info.textContent = s.n+' '+(s.maj?'Major':'Minor')+(activeIdx===hoveredIdx?' · active':'');
  } else {
    info.textContent = activeIdx>=0
      ? SCALES[activeIdx].n+' '+(SCALES[activeIdx].maj?'Major':'Minor')+' · active'
      : 'select a scale';
  }
});

canvas.addEventListener('mouseleave',()=>{
  hoveredIdx=-1;
  info.textContent = activeIdx>=0
    ? SCALES[activeIdx].n+' '+(SCALES[activeIdx].maj?'Major':'Minor')+' · active'
    : 'select a scale';
});

canvas.addEventListener('click', e=>{
  const i = hit(e.clientX,e.clientY);
  if(i<0) return;
  if(i===activeIdx){
    // Tap active pad → stop
    stop();
    activeIdx=-1;
    info.textContent='select a scale';
    return;
  }
  activeIdx = i;
  const s = SCALES[i];
  info.textContent = s.n+' '+(s.maj?'Major':'Minor')+' · active';

  // Unlock audio context on first gesture
  getActx().resume();
  play(i);
});

canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  const t2 = e.touches[0];
  const i  = hit(t2.clientX, t2.clientY);
  if(i<0) return;
  if(i===activeIdx){
    stop();
    activeIdx=-1;
    info.textContent='select a scale';
    return;
  }
  activeIdx=i;
  const s=SCALES[i];
  info.textContent=s.n+' '+(s.maj?'Major':'Minor')+' · active';
  getActx().resume();
  play(i);
},{passive:false});

// ─── BOOT ─────────────────────────────────────────────────────────────────────
resize();
window.addEventListener('resize', resize);
loadAll();   // ← pre-fetches all audio files on page load
loop();
</script>
</body>
</html>
