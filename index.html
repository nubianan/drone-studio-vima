<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Drone Studio">
  <meta name="theme-color" content="#07060a">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Drone Studio</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;width:100%;background:#07060a;color:#e0dcf0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none}
    #app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,12px) env(safe-area-inset-right,0) env(safe-area-inset-bottom,8px) env(safe-area-inset-left,0)}
    #topbar{flex-shrink:0;display:flex;align-items:center;padding:8px 16px;gap:10px;border-bottom:0.5px solid rgba(120,100,200,0.15);background:#0b0a0e;min-height:48px}
    #np-dot{width:7px;height:7px;border-radius:50%;background:rgba(120,100,200,0.28);flex-shrink:0;transition:background .5s}
    #np-dot.live{animation:dp 2s ease-in-out infinite}
    @keyframes dp{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
    #np-text{flex:1;min-width:0}
    #np-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(140,120,220,.42)}
    #np-name{font-size:14px;font-weight:500;color:#e0dcf0;display:none;margin-top:1px}
    #topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
    #np-time{font-size:11px;color:rgba(140,120,220,.42);font-variant-numeric:tabular-nums;display:none}
    .pill{font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:5px 11px;border-radius:20px;cursor:pointer;border:.5px solid rgba(120,100,200,.2);background:rgba(120,100,200,.05);color:rgba(140,120,220,.5);-webkit-appearance:none;transition:all .2s}
    .pill:active{background:rgba(120,100,200,.12)}
    .pill.on{color:#a090e0;border-color:rgba(140,120,220,.45);background:rgba(120,100,200,.1)}
    #stop-btn{color:#a06080;border-color:rgba(160,96,128,.3);background:rgba(160,96,128,.07);display:none}
    #stop-btn.show{display:block}
    #wheel-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
    #wheel-canvas{display:block;touch-action:none}
    #bottombar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:7px 16px;border-top:.5px solid rgba(120,100,200,.1);background:#0b0a0e;min-height:40px}
    #status-text{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(140,120,220,.32)}
    #loaded-count{font-size:10px;color:rgba(140,120,220,.28);letter-spacing:.06em}
    .upload-lbl{font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:5px 11px;border-radius:20px;cursor:pointer;border:.5px solid rgba(120,100,200,.18);background:rgba(120,100,200,.04);color:rgba(140,120,220,.42)}
    .upload-lbl input{display:none}
    .upload-lbl:active{background:rgba(120,100,200,.1)}
    #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center;padding:20px}
    #overlay.show{display:flex}
    #overlay-box{background:#111019;border:.5px solid rgba(120,100,200,.25);border-radius:12px;padding:20px;width:100%;max-width:380px}
    #overlay-box h2{font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#a090e0;margin-bottom:8px}
    #overlay-box p{font-size:12px;color:rgba(224,220,240,.45);line-height:1.6;margin-bottom:14px}
    #olist{display:flex;flex-direction:column;gap:5px;max-height:220px;overflow-y:auto;margin-bottom:14px}
    .orow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;background:#19171f;border:.5px solid rgba(120,100,200,.1)}
    .orow .otag{font-size:11px;font-weight:500;color:#a090e0;min-width:62px}
    .orow .ofile{font-size:11px;color:rgba(224,220,240,.4);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .orow .odot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
    #overlay-close{width:100%;padding:9px;background:rgba(120,100,200,.08);border:.5px solid rgba(120,100,200,.22);border-radius:7px;color:#a090e0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  </style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="np-dot"></div>
    <div id="np-text">
      <div id="np-label">Upload audio · then tap a scale</div>
      <div id="np-name"></div>
    </div>
    <div id="topbar-right">
      <span id="np-time"></span>
      <button class="pill" id="sustain-btn">Sustain</button>
      <button class="pill" id="stop-btn">Stop</button>
    </div>
  </div>
  <div id="wheel-wrap"><canvas id="wheel-canvas"></canvas></div>
  <div id="bottombar">
    <span id="status-text">hover a scale</span>
    <div style="display:flex;align-items:center;gap:8px">
      <label class="upload-lbl">Upload audio <input type="file" id="file-input" accept="audio/*" multiple></label>
      <span id="loaded-count">0/14</span>
    </div>
  </div>
</div>

<div id="overlay">
  <div id="overlay-box">
    <h2>Files loaded</h2>
    <p>Name files like <strong>a-minor.mp3</strong> or <strong>d-minor.wav</strong> for auto-matching.</p>
    <div id="olist"></div>
    <button id="overlay-close">Done</button>
  </div>
</div>

<script>
'use strict';
const SCALES=[
  {n:'A',t:'Minor',h:222,s:68,maj:false},
  {n:'B',t:'Minor',h:245,s:64,maj:false},
  {n:'C',t:'Minor',h:200,s:70,maj:false},
  {n:'D',t:'Minor',h:260,s:66,maj:false},
  {n:'E',t:'Minor',h:210,s:62,maj:false},
  {n:'F',t:'Minor',h:275,s:60,maj:false},
  {n:'G',t:'Minor',h:232,s:65,maj:false},
  {n:'A',t:'Minor',h:222,s:68,maj:false},
  {n:'B',t:'Minor',h:245,s:64,maj:false},
  {n:'C',t:'Minor',h:200,s:70,maj:false},
  {n:'D',t:'Minor',h:260,s:66,maj:false},
  {n:'E',t:'Minor',h:210,s:62,maj:false},
  {n:'F',t:'Minor',h:275,s:60,maj:false},
  {n:'G',t:'Minor',h:232,s:65,maj:false}
];

const audioFiles={};
let actx=null,analyser=null,curSrc=null,curGain=null,curIdx=-1;
let sustain=false,fading=false,startTs=null,timerID=null;
let hoverIdx=-1,animT=0;
let W=0,H=0,S=0,CX=0,CY=0;
let outerPadR=0,outerRingR=0,specOuterR=0,specInnerR=0,waveR=0,centerR=0;

const canvas=document.getElementById('wheel-canvas');
const ctx=canvas.getContext('2d');

function hsl(h,s,l,a=1){return `hsla(${h},${s}%,${l}%,${a})`}

function initAudio(){
  if(actx)return;
  actx=new(window.AudioContext||window.webkitAudioContext)();
  analyser=actx.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=0.84;
  analyser.connect(actx.destination);
}

async function playScale(idx){
  if(!audioFiles[idx]||idx===curIdx||fading)return;
  initAudio();
  if(actx.state==='suspended')await actx.resume();
  fading=true;const FADE=2.5;
  const ng=actx.createGain();ng.gain.setValueAtTime(0,actx.currentTime);ng.connect(analyser);
  const ns=actx.createBufferSource();ns.buffer=audioFiles[idx];ns.loop=sustain;ns.connect(ng);
  if(curGain&&curSrc){
    curGain.gain.setValueAtTime(curGain.gain.value,actx.currentTime);
    curGain.gain.linearRampToValueAtTime(0,actx.currentTime+FADE);
    const og=curGain,os=curSrc;
    setTimeout(()=>{try{os.stop();og.disconnect();}catch(e){}},( FADE+.3)*1000);
  }
  ng.gain.linearRampToValueAtTime(1,actx.currentTime+FADE);ns.start(0);
  curSrc=ns;curGain=ng;curIdx=idx;
  updateTop(idx);startTimer();setTimeout(()=>{fading=false;},FADE*1000);
  ns.onended=()=>{if(curIdx===idx)stopAll();};
}

function stopAll(){
  if(curSrc){try{curSrc.stop();}catch(e){}}
  if(curGain){try{curGain.disconnect();}catch(e){}}
  curSrc=null;curGain=null;curIdx=-1;fading=false;stopTimer();resetTop();
}

function updateTop(idx){
  const sc=SCALES[idx];
  const dot=document.getElementById('np-dot');
  dot.style.background=hsl(sc.h,sc.s,62);dot.classList.add('live');
  document.getElementById('np-label').textContent='Now playing';
  const nm=document.getElementById('np-name');nm.textContent=sc.n+' '+sc.t;nm.style.display='block';
  document.getElementById('np-time').style.display='block';
  document.getElementById('stop-btn').classList.add('show');
}
function resetTop(){
  const dot=document.getElementById('np-dot');dot.style.background='';dot.classList.remove('live');
  document.getElementById('np-label').textContent='Upload audio · then tap a scale';
  document.getElementById('np-name').style.display='none';
  document.getElementById('np-time').style.display='none';document.getElementById('np-time').textContent='';
  document.getElementById('stop-btn').classList.remove('show');
}
function startTimer(){
  stopTimer();startTs=Date.now();
  timerID=setInterval(()=>{
    const e=Math.floor((Date.now()-startTs)/1000);
    const m=Math.floor(e/60),s=e%60;
    const el=document.getElementById('np-time');
    if(el)el.textContent=m+':'+(s.toString().padStart(2,'0'))+' / 10:00';
  },1000);
}
function stopTimer(){if(timerID){clearInterval(timerID);timerID=null;}}

document.getElementById('stop-btn').addEventListener('click',stopAll);
document.getElementById('sustain-btn').addEventListener('click',function(){
  sustain=!sustain;this.classList.toggle('on',sustain);
  this.textContent=sustain?'Sustain on':'Sustain';
  if(curSrc)curSrc.loop=sustain;
});

document.getElementById('file-input').addEventListener('change',async(e)=>{
  initAudio();
  const files=Array.from(e.target.files);const results=[];
  for(const file of files){
    const name=file.name.toLowerCase().replace(/[\s_]+/g,'-');let midx=-1;
    for(let i=0;i<SCALES.length;i++){
      const sc=SCALES[i];const note=sc.n.toLowerCase();
      const pats=[note+'-minor',note+'minor',note+'-min',note+'min','-'+note+'min','_'+note+'min'];
      if(pats.some(p=>name.includes(p))){midx=i;break;}
      if(name.includes(note)&&name.includes('min')){midx=i;break;}
    }
    if(midx<0){
      const rem=SCALES.map((s,i)=>({s,i})).filter(({i})=>!audioFiles[i]);
      const ans=prompt('Which scale is "'+file.name+'"?\n'+rem.map(({s})=>s.n+' '+s.t).join(', '));
      if(ans){const f=SCALES.findIndex(s=>(s.n+' '+s.t).toLowerCase()===ans.toLowerCase().trim());if(f>=0)midx=f;}
    }
    if(midx>=0){
      try{
        const ab=await file.arrayBuffer();
        audioFiles[midx]=await actx.decodeAudioData(ab);
        results.push({scale:SCALES[midx].n+' '+SCALES[midx].t,file:file.name,ok:true});
      }catch{results.push({scale:'?',file:file.name,ok:false});}
    }
  }
  document.getElementById('loaded-count').textContent=Object.keys(audioFiles).length+'/14';
  showOverlay(results);e.target.value='';
});

function showOverlay(results){
  const list=document.getElementById('olist');list.innerHTML='';
  results.forEach(r=>{
    const row=document.createElement('div');row.className='orow';
    row.innerHTML='<span class="otag">'+r.scale+'</span><span class="ofile">'+r.file+'</span><div class="odot" style="background:'+(r.ok?'#4a7a6a':'#7a4a5a')+'"></div>';
    list.appendChild(row);
  });
  document.getElementById('overlay').classList.add('show');
}
document.getElementById('overlay-close').addEventListener('click',()=>document.getElementById('overlay').classList.remove('show'));

function setDims(){
  const wrap=document.getElementById('wheel-wrap');
  W=wrap.clientWidth;H=wrap.clientHeight;S=Math.min(W,H);
  const dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  CX=W/2;CY=H/2;
  outerPadR=S*0.44;outerRingR=S*0.375;
  specOuterR=S*0.34;specInnerR=S*0.215;
  waveR=S*0.186;centerR=S*0.072;
}

function padPos(i){const a=(i/14)*Math.PI*2-Math.PI/2;return{x:CX+Math.cos(a)*outerPadR,y:CY+Math.sin(a)*outerPadR,a};}
function PR(){return S*0.063;}

function ring(r,col,lw,dash){
  ctx.beginPath();ctx.arc(CX,CY,r,0,Math.PI*2);
  ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.setLineDash(dash||[]);ctx.stroke();ctx.setLineDash([]);
}

function drawOuterRing(){
  ctx.beginPath();ctx.arc(CX,CY,outerRingR+16,0,Math.PI*2);ctx.fillStyle='#0d0b14';ctx.fill();
  ring(outerRingR+7,'rgba(120,100,200,0.5)',0.5);
  ring(outerRingR+11,'rgba(120,100,200,0.14)',0.3);
  ring(outerRingR+2,'rgba(120,100,200,0.2)',0.3,[2,4]);
  for(let i=0;i<56;i++){
    const a=(i/56)*Math.PI*2;const maj=i%4===0;
    ctx.beginPath();
    ctx.moveTo(CX+Math.cos(a)*(outerRingR+3),CY+Math.sin(a)*(outerRingR+3));
    ctx.lineTo(CX+Math.cos(a)*(outerRingR+8),CY+Math.sin(a)*(outerRingR+8));
    ctx.strokeStyle=maj?'rgba(140,120,220,0.78)':'rgba(120,100,200,0.18)';ctx.lineWidth=maj?0.9:0.38;ctx.stroke();
  }
  for(let i=0;i<14;i++){
    const a=(i/14)*Math.PI*2-Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(CX+Math.cos(a)*(specOuterR+2),CY+Math.sin(a)*(specOuterR+2));
    ctx.lineTo(CX+Math.cos(a)*(outerRingR-2),CY+Math.sin(a)*(outerRingR-2));
    ctx.strokeStyle='rgba(120,100,200,0.08)';ctx.lineWidth=0.4;ctx.stroke();
    const ma=((i+0.5)/14)*Math.PI*2-Math.PI/2;
    const dmx=CX+Math.cos(ma)*(outerRingR+20);const dmy=CY+Math.sin(ma)*(outerRingR+20);
    ctx.save();ctx.translate(dmx,dmy);ctx.rotate(ma+Math.PI/2);
    ctx.beginPath();ctx.moveTo(0,-2.2);ctx.lineTo(1.6,1.4);ctx.lineTo(0,0.4);ctx.lineTo(-1.6,1.4);
    ctx.closePath();ctx.fillStyle='rgba(140,120,220,0.36)';ctx.fill();ctx.restore();
  }
}

function drawSpectrum(t2){
  const sc=curIdx>=0?SCALES[curIdx]:null;
  ring(specOuterR,'rgba(120,100,200,0.12)',0.4);ring(specInnerR,'rgba(120,100,200,0.12)',0.4);
  let fd=null;
  if(analyser&&curIdx>=0){fd=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(fd);}
  const bars=128;
  for(let i=0;i<bars;i++){
    const a=(i/bars)*Math.PI*2-Math.PI/2;let v=0;
    if(fd){v=fd[Math.floor(i*fd.length/(bars*2.6))]/255;}
    else{v=Math.max(0,Math.abs(Math.sin(i*0.19+t2*1.2)*0.38+Math.sin(i*0.44+t2*0.85)*0.16)-0.04);}
    const ir=specInnerR+2;const or2=specInnerR+2+(specOuterR-specInnerR-4)*v;
    if(or2<=ir)continue;
    const ah=Math.PI*2/bars*0.43;
    ctx.beginPath();ctx.arc(CX,CY,ir,a-ah,a+ah);ctx.arc(CX,CY,or2,a+ah,a-ah,true);ctx.closePath();
    const alpha=0.1+v*0.72;
    ctx.fillStyle=sc?hsl(sc.h,sc.s,46,alpha):'rgba(120,100,200,'+(alpha*0.55)+')';ctx.fill();
    if(v>0.5){ctx.strokeStyle=sc?hsl(sc.h,sc.s,68,v*0.45):'rgba(140,120,220,0.2)';ctx.lineWidth=0.3;ctx.stroke();}
  }
}

function drawWave(t2){
  const sc=curIdx>=0?SCALES[curIdx]:null;const R=waveR;
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.fillStyle='#100e18';ctx.fill();
  ring(R,'rgba(120,100,200,0.15)',0.4);
  let wd=null;
  if(analyser&&curIdx>=0){wd=new Uint8Array(analyser.frequencyBinCount);analyser.getByteTimeDomainData(wd);}
  const pts=512;ctx.beginPath();
  for(let i=0;i<=pts;i++){
    const a=(i/pts)*Math.PI*2-Math.PI/2;let amp=0;
    if(wd){const si=Math.floor((i/pts)*wd.length);amp=(wd[si]/128-1)*R*0.36;}
    else{const x=i/pts;amp=(Math.sin(x*6.28*3+t2*2)*0.5+Math.sin(x*6.28*7+t2*1.3)*0.25+Math.sin(x*6.28*1.6+t2*0.7)*0.25)*R*0.14;}
    const r2=R+amp;
    i===0?ctx.moveTo(CX+Math.cos(a)*r2,CY+Math.sin(a)*r2):ctx.lineTo(CX+Math.cos(a)*r2,CY+Math.sin(a)*r2);
  }
  ctx.closePath();
  if(sc){ctx.strokeStyle=hsl(sc.h,sc.s,66,0.9);ctx.lineWidth=1.3;ctx.fillStyle=hsl(sc.h,sc.s,34,0.13);}
  else{ctx.strokeStyle='rgba(120,100,200,0.2)';ctx.lineWidth=0.7;ctx.fillStyle='transparent';}
  ctx.stroke();ctx.fill();
}

function drawCenter(t2){
  const sc=curIdx>=0?SCALES[curIdx]:null;const r=centerR;
  for(let k=3;k>=1;k--){
    ctx.beginPath();ctx.arc(CX,CY,r*(0.65+k*0.2)+(sc?Math.sin(t2*2.2+k)*1.4:0),0,Math.PI*2);
    ctx.strokeStyle=sc?hsl(sc.h,sc.s,52,0.27/k):'rgba(120,100,200,0.06)';ctx.lineWidth=0.5;ctx.stroke();
  }
  ctx.beginPath();ctx.arc(CX,CY,r,0,Math.PI*2);
  ctx.fillStyle=sc?hsl(sc.h,sc.s,11,1):'#12101a';ctx.fill();
  ctx.strokeStyle=sc?hsl(sc.h,sc.s,50,0.8):'rgba(120,100,200,0.26)';ctx.lineWidth=sc?1:0.5;ctx.stroke();
  for(let k=0;k<8;k++){
    const a=(k/8)*Math.PI*2+(t2*0.12);
    ctx.beginPath();ctx.moveTo(CX+Math.cos(a)*r*0.3,CY+Math.sin(a)*r*0.3);
    ctx.lineTo(CX+Math.cos(a)*r*0.74,CY+Math.sin(a)*r*0.74);
    ctx.strokeStyle=sc?hsl(sc.h,sc.s,44,0.36):'rgba(120,100,200,0.12)';ctx.lineWidth=0.5;ctx.stroke();
  }
  ctx.beginPath();ctx.arc(CX,CY,r*0.3,0,Math.PI*2);
  ctx.fillStyle=sc?hsl(sc.h,sc.s,58,1):'rgba(120,100,200,0.5)';ctx.fill();
  if(sc){
    ctx.fillStyle='rgba(230,225,255,0.92)';ctx.font='500 '+(r*0.44)+'px -apple-system,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(sc.n,CX,CY-r*0.06);
    ctx.fillStyle='rgba(200,195,240,0.48)';ctx.font=(r*0.2)+'px -apple-system,sans-serif';
    ctx.fillText(sc.t.toUpperCase(),CX,CY+r*0.38);
  }
}

function drawPad(sc,i,t2){
  const {x,y}=padPos(i);const isA=i===curIdx;const isH=i===hoverIdx;const hasA=!!audioFiles[i];
  const pr=PR();const pulse=isA?1+Math.sin(t2*2.8)*0.055:1;const r=pr*pulse;
  ctx.save();ctx.translate(x,y);
  if(isA){for(let k=1;k<=3;k++){ctx.beginPath();ctx.arc(0,0,r*(1.24+k*0.22)+Math.sin(t2*2+k)*2,0,Math.PI*2);ctx.strokeStyle=hsl(sc.h,sc.s,58,0.4/k);ctx.lineWidth=0.7;ctx.stroke();}}
  else if(isH&&hasA){ctx.beginPath();ctx.arc(0,0,r*1.3,0,Math.PI*2);ctx.strokeStyle=hsl(sc.h,sc.s,52,0.28);ctx.lineWidth=0.5;ctx.stroke();}
  for(let k=0;k<8;k++){
    const ta=(k/8)*Math.PI*2;
    ctx.beginPath();ctx.moveTo(Math.cos(ta)*r*0.9,Math.sin(ta)*r*0.9);ctx.lineTo(Math.cos(ta)*r*1.15,Math.sin(ta)*r*1.15);
    ctx.strokeStyle=hsl(sc.h,sc.s,isA?58:hasA?34:15,isA?0.82:hasA?0.4:0.15);ctx.lineWidth=isA?1:0.5;ctx.stroke();
    const ta2=((k+0.5)/8)*Math.PI*2;
    ctx.beginPath();ctx.moveTo(Math.cos(ta2)*r*0.96,Math.sin(ta2)*r*0.96);ctx.lineTo(Math.cos(ta2)*r*1.06,Math.sin(ta2)*r*1.06);
    ctx.strokeStyle=hsl(sc.h,sc.s,isA?42:22,0.24);ctx.lineWidth=0.32;ctx.stroke();
  }
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fillStyle=hasA?hsl(sc.h,sc.s*0.7,isA?15:isH?12:8,1):'#0e0c14';ctx.fill();
  ctx.strokeStyle=hsl(sc.h,sc.s,isA?62:hasA?38:18,isA?1:hasA?0.6:0.18);ctx.lineWidth=isA?1.4:0.65;ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,r*0.74,0,Math.PI*2);ctx.strokeStyle=hsl(sc.h,sc.s,isA?40:hasA?22:12,0.34);ctx.lineWidth=0.38;ctx.stroke();
  for(let k=0;k<4;k++){
    const ka=(k/4)*Math.PI*2+Math.PI/8;
    ctx.beginPath();ctx.moveTo(Math.cos(ka)*r*0.48,Math.sin(ka)*r*0.48);ctx.lineTo(Math.cos(ka)*r*0.71,Math.sin(ka)*r*0.71);
    ctx.strokeStyle=hsl(sc.h,sc.s,isA?38:hasA?20:10,0.26);ctx.lineWidth=0.36;ctx.stroke();
  }
  ctx.fillStyle=isA?hsl(sc.h,sc.s,90):hasA?hsl(sc.h,sc.s,66):'rgba(200,195,240,0.16)';
  ctx.font='500 '+(r*0.54)+'px -apple-system,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(sc.n,0,-r*0.08);
  ctx.fillStyle=isA?hsl(sc.h,sc.s,68):hasA?hsl(sc.h,sc.s,44):'rgba(200,195,240,0.1)';
  ctx.font=(r*0.25)+'px -apple-system,sans-serif';ctx.fillText(sc.t.toUpperCase(),0,r*0.42);
  ctx.restore();
}

function draw(t2){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#07060a';ctx.fillRect(0,0,W,H);
  drawOuterRing();drawSpectrum(t2);drawWave(t2);drawCenter(t2);
  SCALES.forEach((sc,i)=>drawPad(sc,i,t2));
}

function loop(){animT+=0.015;draw(animT);requestAnimationFrame(loop);}

function hit(ex,ey){
  const rect=canvas.getBoundingClientRect();const scl=W/rect.width;
  const mx=(ex-rect.left)*scl,my=(ey-rect.top)*scl;const pr=PR();
  for(let i=0;i<14;i++){const{x,y}=padPos(i);if(Math.hypot(mx-x,my-y)<pr*1.4)return i;}
  return -1;
}

canvas.addEventListener('mousemove',e=>{
  const i=hit(e.clientX,e.clientY);hoverIdx=i;
  canvas.style.cursor=(i>=0&&audioFiles[i])?'pointer':'default';
  const st=document.getElementById('status-text');
  if(i>=0)st.textContent=SCALES[i].n+' '+SCALES[i].t+(audioFiles[i]?'':' · no file loaded');
  else st.textContent='hover a scale';
});
canvas.addEventListener('mouseleave',()=>{hoverIdx=-1;document.getElementById('status-text').textContent='hover a scale';});
canvas.addEventListener('click',e=>{const i=hit(e.clientX,e.clientY);if(i>=0&&audioFiles[i])playScale(i);});
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();const t=e.touches[0];const i=hit(t.clientX,t.clientY);
  if(i>=0&&audioFiles[i])playScale(i);
},{passive:false});

window.addEventListener('resize',setDims);
setDims();loop();

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}
</script>
