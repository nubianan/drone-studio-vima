
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drone Studio">
<meta name="theme-color" content="#0e1a14">
<link rel="manifest" href="manifest.json">
<title>Drone Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:-apple-system,sans-serif;background:#0e1a14;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100dvh;display:flex;flex-direction:column}
#top{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(8,18,10,.97);border-bottom:.5px solid rgba(90,140,80,.18);min-height:46px;z-index:10}
#dot{width:6px;height:6px;border-radius:50%;background:rgba(90,140,80,.25);flex-shrink:0;transition:background .9s}
#dot.on{animation:dp 2.5s ease-in-out infinite}
@keyframes dp{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.9);opacity:.35}}
#ntx{flex:1}#nlb{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:rgba(120,175,100,.28)}
#nnm{font-size:12px;color:#aec89a;display:none;font-style:italic;margin-top:1px}
#nrt{display:flex;align-items:center;gap:7px;flex-shrink:0}
#ntm{font-size:11px;color:rgba(120,175,100,.25);font-variant-numeric:tabular-nums;display:none}
.bp{font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:12px;cursor:pointer;border:.5px solid rgba(90,140,80,.2);background:rgba(90,140,80,.05);color:rgba(120,175,100,.42);-webkit-appearance:none;transition:all .2s}
.bp:hover{background:rgba(90,140,80,.1);color:rgba(150,210,120,.85)}
.bp.on{color:#9cc878;border-color:rgba(100,160,80,.44);background:rgba(90,140,80,.1)}
#sb{color:#a07858;border-color:rgba(150,110,70,.22);background:rgba(150,110,70,.05);display:none}
#sb.on{display:block}
#scene{flex:1;position:relative;overflow:hidden}
#bc,#wc,#oc{position:absolute;inset:0;width:100%;height:100%}
#wc,#oc{pointer-events:none}
#hl{position:absolute;inset:0;cursor:crosshair;background:transparent}
#bot{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:6px 14px;background:rgba(8,18,10,.97);border-top:.5px solid rgba(90,140,80,.1);min-height:38px;z-index:10}
#hint{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(120,175,100,.28);transition:opacity 2s}
#stlbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(120,175,100,.32)}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="dot"></div>
    <div id="ntx"><div id="nlb">Touch the stone to begin</div><div id="nnm"></div></div>
    <div id="nrt"><span id="ntm"></span><button class="bp" id="sus">Sustain</button><button class="bp" id="sb">Stop</button></div>
  </div>
  <div id="scene">
    <canvas id="bc"></canvas><canvas id="wc"></canvas><canvas id="oc"></canvas>
    <div id="hl"></div>
  </div>
  <div id="bot"><span id="hint">Seven marks are hidden in the stone</span><span id="stlbl"></span></div>
</div>

<script>
'use strict';
const SCALES=[{n:'A',label:'A MINOR'},{n:'B',label:'B MINOR'},{n:'C',label:'C MINOR'},{n:'D',label:'D MINOR'},{n:'E',label:'E MINOR'},{n:'F',label:'F MINOR'},{n:'G',label:'G MINOR'}];
const POS=[[.21,.17],[.71,.12],[.58,.38],[.83,.58],[.36,.74],[.14,.55],[.62,.85]];
const AUDIO_PATHS=['audio/A MINOR.mp3','audio/B MINOR.mp3','audio/C MINOR.mp3','audio/D MINOR.mp3','audio/E MINOR.mp3','audio/F MINOR.mp3','audio/G MINOR.mp3'];
const bufs={};
let ac=null,an=null,cs=null,cg=null,ci=-1,sus=false,fad=false,ts=null,tid=null;
let hi=-1,T=0,W=0,H=0,shimT=0,shimActive=true,streamOn=false,streamStart=null;
const SWELL_MS=2000,FULL_W=18,POOL_RAISE=50;
let stonePat=null,bustImg=null,algaeImg=null;

const bc=document.getElementById('bc'),bx=bc.getContext('2d');
const wc=document.getElementById('wc'),wx=wc.getContext('2d');
const oc=document.getElementById('oc'),ox=oc.getContext('2d');

function loadImg(b64,type){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src='data:image/'+type+';base64,'+b64;});}
function initA(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=.86;an.connect(ac.destination);}
async function loadAll(){initA();for(let i=0;i<AUDIO_PATHS.length;i++){try{const r=await fetch(AUDIO_PATHS[i]);if(!r.ok)continue;bufs[i]=await ac.decodeAudioData(await r.arrayBuffer());}catch(e){}}}

async function play(idx){
  if(fad)return;initA();if(ac.state==='suspended')await ac.resume();
  if(idx===ci){if(!bufs[idx])return;fad=true;const F=.4;const ng=ac.createGain();ng.gain.setValueAtTime(0,ac.currentTime);ng.connect(an);const ns=ac.createBufferSource();ns.buffer=bufs[idx];ns.loop=sus;ns.connect(ng);if(cg&&cs){cg.gain.linearRampToValueAtTime(0,ac.currentTime+F);const og=cg,os=cs;setTimeout(()=>{try{os.stop();og.disconnect();}catch(e){}},600);}ng.gain.linearRampToValueAtTime(1,ac.currentTime+F);ns.start(0);cs=ns;cg=ng;stTim();setTimeout(()=>{fad=false;},500);ns.onended=()=>{if(ci===idx)stopA();};startStream(idx);return;}
  if(!bufs[idx])return;fad=true;const FADE=2.5;const ng=ac.createGain();ng.gain.setValueAtTime(0,ac.currentTime);ng.connect(an);const ns=ac.createBufferSource();ns.buffer=bufs[idx];ns.loop=sus;ns.connect(ng);
  if(cg&&cs){cg.gain.setValueAtTime(cg.gain.value,ac.currentTime);cg.gain.linearRampToValueAtTime(0,ac.currentTime+FADE);const og=cg,os=cs;setTimeout(()=>{try{os.stop();og.disconnect();}catch(e){}},( FADE+.3)*1000);}
  ng.gain.linearRampToValueAtTime(1,ac.currentTime+FADE);ns.start(0);cs=ns;cg=ng;ci=idx;upTop(idx);stTim();setTimeout(()=>{fad=false;},FADE*1000);ns.onended=()=>{if(ci===idx)stopA();};startStream(idx);
}
function stopA(){if(cs){try{cs.stop();}catch(e){}}if(cg){try{cg.disconnect();}catch(e){}}cs=null;cg=null;ci=-1;fad=false;streamOn=false;streamStart=null;stpTim();rsTop();}
function upTop(i){const d=document.getElementById('dot');d.style.background='rgba(120,190,90,.85)';d.classList.add('on');document.getElementById('nlb').textContent='Now playing';const nm=document.getElementById('nnm');nm.textContent=SCALES[i].label;nm.style.display='block';document.getElementById('ntm').style.display='block';document.getElementById('sb').classList.add('on');}
function rsTop(){const d=document.getElementById('dot');d.style.background='';d.classList.remove('on');document.getElementById('nlb').textContent='Touch the stone to begin';document.getElementById('nnm').style.display='none';document.getElementById('ntm').style.display='none';document.getElementById('ntm').textContent='';document.getElementById('sb').classList.remove('on');document.getElementById('stlbl').textContent='';}
function stTim(){stpTim();ts=Date.now();tid=setInterval(()=>{const e=Math.floor((Date.now()-ts)/1000),m=Math.floor(e/60),s=e%60;const el=document.getElementById('ntm');if(el)el.textContent=m+':'+(s+'').padStart(2,'0')+' / 10:00';},1000);}
function stpTim(){if(tid){clearInterval(tid);tid=null;}}
document.getElementById('sb').addEventListener('click',stopA);
document.getElementById('sus').addEventListener('click',function(){sus=!sus;this.classList.toggle('on',sus);this.textContent=sus?'Sustain on':'Sustain';if(cs)cs.loop=sus;});
function startStream(idx){streamOn=true;streamStart=performance.now();}

function heightEase(t){const h=Math.min(1,t);return h<.5?4*h*h*h:1-Math.pow(-2*h+2,3)/2;}
function widthEase(t){if(t<.5)return 16*t*t*t*t*t;return 1-Math.pow(-2*t+2,5)/2;}
function fbm(x,t){return Math.sin(x*1.7+t)*.5+Math.sin(x*3.3-t*1.3)*.25+Math.sin(x*6.1+t*.7)*.12+Math.sin(x*11.9-t*.5)*.06;}
function poolY(){return H-POOL_RAISE;}

// ── ALWAYS-VISIBLE STAGNANT POOL (centerpiece reflection always present) ──
function drawStagnantPool(t2){
  const pY=poolY(),poolW=W*.52,poolDepth=16;
  const cx=W*.5,coinR=W*.155;

  // Pool water surface — dark, still, slightly reflective
  wx.save();
  wx.beginPath();wx.ellipse(cx,pY,poolW,poolDepth,0,0,Math.PI*2);wx.clip();

  // Dark water base
  const waterGrad=wx.createRadialGradient(cx,pY,0,cx,pY,poolW);
  waterGrad.addColorStop(0,'rgba(20,55,35,0.82)');
  waterGrad.addColorStop(.4,'rgba(12,38,22,0.88)');
  waterGrad.addColorStop(.8,'rgba(6,22,12,0.92)');
  waterGrad.addColorStop(1,'rgba(2,10,6,0.96)');
  wx.fillStyle=waterGrad;wx.beginPath();wx.ellipse(cx,pY,poolW,poolDepth,0,0,Math.PI*2);wx.fill();

  // Centerpiece reflection — ALWAYS present in still pool
  if(bustImg){
    wx.save();
    wx.globalAlpha=0.12;
    wx.translate(cx,pY);
    wx.scale(1,-0.18); // squished upward reflection
    const iw=bustImg.naturalWidth,ih=bustImg.naturalHeight;
    const rR=coinR*.5;
    const sc=Math.min(rR*2/iw,rR*2/ih);
    wx.drawImage(bustImg,0,0,iw,ih,-iw*sc/2,-ih*sc/2,iw*sc,ih*sc);
    wx.restore();
    // Green tint over reflection
    wx.globalCompositeOperation='multiply';
    const rTint=wx.createRadialGradient(cx,pY,0,cx,pY,coinR*.55);
    rTint.addColorStop(0,'rgba(55,120,65,0.75)');rTint.addColorStop(1,'rgba(20,60,30,0.55)');
    wx.fillStyle=rTint;wx.beginPath();wx.ellipse(cx,pY,coinR*.55,poolDepth*.75,0,0,Math.PI*2);wx.fill();
    wx.globalCompositeOperation='source-over';
  }

  // Slow barely-perceptible ripples on still surface
  for(let r=1;r<=3;r++){
    const ph=((t2*.12)+r/3)%1; // very slow
    const rW=poolW*(.15+ph*.7),rH=Math.max(.55,rW*.055);
    const rA=Math.sin(ph*Math.PI)*0.08;
    wx.beginPath();wx.ellipse(cx,pY,rW,rH,0,0,Math.PI*2);
    wx.strokeStyle=`rgba(100,175,130,${rA})`;wx.lineWidth=.5;wx.stroke();
  }

  // Pool surface specular — faint highlight where light hits
  const specG=wx.createLinearGradient(cx-poolW*.3,pY-poolDepth*.4,cx+poolW*.3,pY-poolDepth*.2);
  specG.addColorStop(0,'rgba(0,0,0,0)');specG.addColorStop(.4,'rgba(120,200,160,0.06)');specG.addColorStop(1,'rgba(0,0,0,0)');
  wx.fillStyle=specG;wx.beginPath();wx.ellipse(cx,pY,poolW*.85,poolDepth*.55,0,0,Math.PI*2);wx.fill();

  wx.restore();

  // Pool rim highlight
  wx.beginPath();wx.ellipse(cx,pY,poolW*.98,poolDepth*.5,0,0,Math.PI,-Math.PI,true);
  wx.strokeStyle='rgba(90,160,110,.12)';wx.lineWidth=.8;wx.stroke();
}

// ── ACTIVE STREAM + DISTURBANCE EFFECTS ──────────────────────────────
function drawStream(t2){
  wx.clearRect(0,0,W,H);

  // Pool is ALWAYS drawn first
  drawStagnantPool(t2);

  if(!streamOn||ci<0)return;
  const elapsed=performance.now()-streamStart,rawT=Math.min(1,elapsed/SWELL_MS);
  const[fx,fy]=POS[ci];const sx=fx*W,sy=fy*H;
  const pY=poolY();
  const maxH=pY-sy;
  const streamH=Math.max(4,maxH*(.08+.92*heightEase(rawT)));
  const widthT=widthEase(rawT),bodyW=Math.max(.4,FULL_W*widthT),a=Math.min(1,widthT*1.3+.05),ws=widthT;
  const steps=140,L=[],R=[];
  for(let i=0;i<=steps;i++){
    const fr=i/steps,y=sy+fr*streamH,nr=1-fr*.35,bw=bodyW*nr;
    const lN=fbm(fr*4,t2*.9)*6*ws+fbm(fr*9,t2*1.4)*2*ws;
    const rN=fbm(fr*4+5,t2*.85)*6*ws+fbm(fr*9+8,t2*1.35)*2*ws;
    const sw=Math.sin(fr*2.8+t2*.55)*4*(1-fr*.3)*ws;
    L.push({x:sx+sw-bw+lN,y});R.push({x:sx+sw+bw+rN,y});
  }
  wx.beginPath();wx.moveTo(L[0].x,L[0].y);for(let i=1;i<=steps;i++){const p=L[i-1],q=L[i];wx.quadraticCurveTo(p.x,p.y,(p.x+q.x)/2,(p.y+q.y)/2);}
  wx.lineTo(R[steps].x,R[steps].y);for(let i=steps-1;i>=0;i--){const p=R[i+1],q=R[i];wx.quadraticCurveTo(p.x,p.y,(p.x+q.x)/2,(p.y+q.y)/2);}
  wx.closePath();
  const bg=wx.createLinearGradient(sx-bodyW,sy,sx+bodyW,sy);
  bg.addColorStop(0,`rgba(120,185,165,${.18*a})`);bg.addColorStop(.3,`rgba(185,230,218,${.32*a})`);
  bg.addColorStop(.5,`rgba(220,250,242,${.45*a})`);bg.addColorStop(.7,`rgba(185,230,218,${.32*a})`);
  bg.addColorStop(1,`rgba(120,185,165,${.18*a})`);
  wx.fillStyle=bg;wx.fill();
  if(widthT>.05){const sa=Math.min(1,(widthT-.05)/.4);[-7,-3,0,3,7,10].forEach((off,si)=>{wx.beginPath();wx.moveTo(sx+off*ws,sy);let px=sx+off*ws,py=sy;for(let i=1;i<=steps;i++){const fr=i/steps,y=sy+fr*streamH;const sw2=Math.sin(fr*2.8+t2*.55)*4*(1-fr*.3)*ws;const en=fbm(fr*5+si*1.7,t2*(.8+si*.1))*4*ws;const nr=1-fr*.35;const nx=Math.max(sx+sw2-bodyW*nr+1,Math.min(sx+sw2+bodyW*nr-1,sx+sw2+off*ws+en));wx.quadraticCurveTo(px,py,(px+nx)/2,(py+y)/2);px=nx;py=y;}const base=(si===2||si===3)?.55:.28;const sg=wx.createLinearGradient(0,sy,0,sy+streamH);sg.addColorStop(0,'rgba(240,255,250,0)');sg.addColorStop(.05,`rgba(240,255,250,${base*a*sa})`);sg.addColorStop(.5,`rgba(215,245,235,${base*.7*a*sa})`);sg.addColorStop(.85,`rgba(190,235,222,${base*.4*a*sa})`);sg.addColorStop(1,'rgba(170,220,208,0)');wx.strokeStyle=sg;wx.lineWidth=(si===2||si===3)?1.4:.7;wx.stroke();});}
  [L,R].forEach(pts=>{wx.beginPath();wx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<=steps;i++){const p=pts[i-1],q=pts[i];wx.quadraticCurveTo(p.x,p.y,(p.x+q.x)/2,(p.y+q.y)/2);}const eg=wx.createLinearGradient(0,sy,0,sy+streamH);eg.addColorStop(0,'rgba(255,255,255,0)');eg.addColorStop(.04,`rgba(255,255,255,${.75*a})`);eg.addColorStop(.3,`rgba(220,245,238,${.45*a})`);eg.addColorStop(.7,`rgba(190,230,218,${.2*a})`);eg.addColorStop(1,'rgba(170,215,205,0)');wx.strokeStyle=eg;wx.lineWidth=Math.max(.22,1.32*widthT);wx.stroke();});

  const pFr=Math.min(1,streamH/Math.max(1,pY-sy)),pa=pFr*a;

  // Splash / disturbed water where stream hits the pool
  if(pa>.1){
    const poolW=W*.52,poolDepth=16;
    const impactGlow=wx.createRadialGradient(sx,pY,0,sx,pY,bodyW*4);
    impactGlow.addColorStop(0,`rgba(200,245,230,${.45*pa})`);
    impactGlow.addColorStop(.35,`rgba(155,220,200,${.2*pa})`);
    impactGlow.addColorStop(.7,`rgba(100,185,160,${.08*pa})`);
    impactGlow.addColorStop(1,'rgba(60,140,110,0)');
    wx.beginPath();wx.ellipse(sx,pY,bodyW*4,poolDepth*.7,0,0,Math.PI*2);wx.fillStyle=impactGlow;wx.fill();

    // Active ripples from impact point — spread wide
    const mRW=W*.5;
    for(let r=1;r<=5;r++){
      const ph=((t2*.42)+r/5)%1,pr=Math.pow(ph,.6),rW=bodyW*1.5+mRW*pr,rH=Math.max(.6,rW*.06*(1-pr*.5));
      const rA=Math.sin(ph*Math.PI)*(0.24-pr*.14)*pa;if(rA<.004)continue;
      wx.beginPath();wx.ellipse(sx,pY,rW,rH,0,0,Math.PI*2);
      wx.strokeStyle=`rgba(195,238,222,${rA})`;wx.lineWidth=Math.max(.33,1.21*(1-pr*.7));wx.stroke();
    }
    for(let r=1;r<=3;r++){
      const ph=((t2*.22)+r/3+.2)%1,rW=W*.2+W*.32*Math.pow(ph,.5);
      const rA=Math.sin(ph*Math.PI)*0.1*pa;if(rA<.004)continue;
      wx.beginPath();wx.ellipse(sx,pY,rW,Math.max(.4,rW*.036),0,0,Math.PI*2);
      wx.strokeStyle=`rgba(175,220,205,${rA})`;wx.lineWidth=.35;wx.stroke();
    }

    // Stream reflection in pool — only at impact x
    if(pa>.15){
      const refH=Math.min(streamH*.2,POOL_RAISE*.65);
      wx.save();
      wx.beginPath();wx.ellipse(W*.5,pY,poolW,poolDepth,0,0,Math.PI*2);wx.clip();
      wx.beginPath();wx.moveTo(sx-bodyW*.4,pY);wx.lineTo(sx+bodyW*.4,pY);wx.lineTo(sx+fbm(3,t2)*3+bodyW*.2,pY+refH);wx.lineTo(sx+fbm(4,t2)*3-bodyW*.2,pY+refH);wx.closePath();
      const rg=wx.createLinearGradient(sx,pY,sx,pY+refH);
      rg.addColorStop(0,`rgba(200,248,235,${pa*.3})`);rg.addColorStop(.5,`rgba(155,225,210,${pa*.15})`);rg.addColorStop(1,'rgba(100,185,165,0)');
      wx.fillStyle=rg;wx.fill();
      wx.restore();
    }
  }
}

function setD(){
  const sc=document.getElementById('scene');W=sc.clientWidth;H=sc.clientHeight;
  const dpr=window.devicePixelRatio||1;
  for(const c of[bc,wc,oc]){c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';}
  bx.setTransform(dpr,0,0,dpr,0,0);wx.setTransform(dpr,0,0,dpr,0,0);ox.setTransform(dpr,0,0,dpr,0,0);
  paintBg();
}

function paintBg(){
  bx.clearRect(0,0,W,H);
  // Stone texture full background
  if(stonePat) bx.drawImage(stonePat,0,0,W,H);
  else{bx.fillStyle='#1a2820';bx.fillRect(0,0,W,H);}
  // Bronze-green tint
  const tint=bx.createLinearGradient(0,0,W,H);
  tint.addColorStop(0,'rgba(12,38,18,0.74)');tint.addColorStop(.4,'rgba(16,46,22,0.68)');
  tint.addColorStop(.7,'rgba(10,32,14,0.72)');tint.addColorStop(1,'rgba(6,22,10,0.80)');
  bx.fillStyle=tint;bx.fillRect(0,0,W,H);
  const pat2=bx.createRadialGradient(W*.38,H*.35,0,W*.5,H*.5,W*.75);
  pat2.addColorStop(0,'rgba(50,95,55,0.18)');pat2.addColorStop(.5,'rgba(32,68,36,0.08)');pat2.addColorStop(1,'rgba(0,0,0,0)');
  bx.fillStyle=pat2;bx.fillRect(0,0,W,H);

  // ── ALGAE BAND: from poolY-50 to poolY (0px to 50px zone) ────────────
  drawAlgaeBand();

  // ── Carved pool basin ─────────────────────────────────────────────────
  drawPoolBasin();

  drawRelief();

  const vg=bx.createRadialGradient(W*.5,H*.5,H*.12,W*.5,H*.5,W*.85);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(2,6,3,.68)');
  bx.fillStyle=vg;bx.fillRect(0,0,W,H);
}

function drawAlgaeBand(){
  if(!algaeImg) return;
  const pY=poolY();
  const bandTop=pY-POOL_RAISE; // algae occupies 50px above pool
  const blendPx=20;            // gradual stone→algae transition over 20px above bandTop
  const drawTop=bandTop-blendPx; // start drawing 20px higher to allow the fade in

  bx.save();
  // Clip to the full zone including the 20px blend above
  bx.beginPath();bx.rect(0,drawTop,W,POOL_RAISE+blendPx);bx.clip();

  // Draw algae image stretched to fill the 50px band (positioned at bandTop)
  bx.globalAlpha=0.90;
  bx.drawImage(algaeImg,0,bandTop,W,POOL_RAISE);
  bx.globalAlpha=1;

  // Colour-grade: multiply tint to match bronze-green palette
  bx.globalCompositeOperation='multiply';
  const colorMatch=bx.createLinearGradient(0,bandTop,0,pY);
  colorMatch.addColorStop(0,'rgba(20,52,16,0.52)');
  colorMatch.addColorStop(.5,'rgba(26,62,18,0.40)');
  colorMatch.addColorStop(1,'rgba(32,72,20,0.28)');
  bx.fillStyle=colorMatch;bx.fillRect(0,bandTop,W,POOL_RAISE);
  bx.globalCompositeOperation='source-over';

  // Upper blend zone — 20px gradual fade from stone colour into algae
  // Stone base colour is roughly rgba(14,38,16) after tint overlay
  // Fade: fully opaque stone at drawTop, fully transparent at bandTop
  const topBlend=bx.createLinearGradient(0,drawTop,0,bandTop);
  topBlend.addColorStop(0,'rgba(14,38,16,1.0)');  // stone colour — fully masks algae
  topBlend.addColorStop(.35,'rgba(14,38,16,0.85)');
  topBlend.addColorStop(.70,'rgba(14,38,16,0.45)');
  topBlend.addColorStop(1,'rgba(14,38,16,0.0)');  // fully reveals algae at band start
  bx.fillStyle=topBlend;bx.fillRect(0,drawTop,W,blendPx);

  // Side vignettes — edges fade into stone so algae doesn't hard-cut
  const leftV=bx.createLinearGradient(0,0,W*.10,0);
  leftV.addColorStop(0,'rgba(12,32,14,0.90)');leftV.addColorStop(1,'rgba(12,32,14,0)');
  bx.fillStyle=leftV;bx.fillRect(0,drawTop,W*.10,POOL_RAISE+blendPx);
  const rightV=bx.createLinearGradient(W*.90,0,W,0);
  rightV.addColorStop(0,'rgba(12,32,14,0)');rightV.addColorStop(1,'rgba(12,32,14,0.90)');
  bx.fillStyle=rightV;bx.fillRect(W*.90,drawTop,W*.10,POOL_RAISE+blendPx);

  bx.restore();
}

function drawPoolBasin(){
  const pY=poolY(),poolW=W*.52,poolDepth=16;
  // Dark depression shadow
  const bsG=bx.createRadialGradient(W*.5,pY+4,0,W*.5,pY,poolW);
  bsG.addColorStop(0,'rgba(1,6,3,.40)');bsG.addColorStop(.6,'rgba(1,6,3,.20)');bsG.addColorStop(1,'rgba(1,6,3,0)');
  bx.fillStyle=bsG;bx.beginPath();bx.ellipse(W*.5,pY,poolW,poolDepth*1.5,0,0,Math.PI*2);bx.fill();
  // Dark floor below pool
  const floorG=bx.createLinearGradient(0,pY,0,H);
  floorG.addColorStop(0,'rgba(3,12,5,.28)');floorG.addColorStop(1,'rgba(1,8,3,.55)');
  bx.fillStyle=floorG;bx.fillRect(0,pY+poolDepth,W,H-pY-poolDepth);
}

function drawBustMedallion(){
  if(!bustImg)return;
  const cx=W*.5,cy=H*.42,coinR=W*.155,diam=coinR*2;
  bx.save();bx.beginPath();bx.arc(cx,cy,coinR,0,Math.PI*2);bx.clip();
  const iw=bustImg.naturalWidth,ih=bustImg.naturalHeight;
  const sc2=Math.min(diam/iw,diam/ih),dw=iw*sc2,dh=ih*sc2;
  bx.drawImage(bustImg,0,0,iw,ih,cx-dw/2,cy-dh/2,dw,dh);
  bx.globalCompositeOperation='saturation';bx.fillStyle='rgba(128,128,128,0.30)';bx.beginPath();bx.arc(cx,cy,coinR,0,Math.PI*2);bx.fill();
  bx.globalCompositeOperation='multiply';
  const cg2=bx.createRadialGradient(cx-coinR*.15,cy-coinR*.25,coinR*.08,cx,cy,coinR);
  cg2.addColorStop(0,'rgba(92,155,95,0.68)');cg2.addColorStop(.4,'rgba(62,115,66,0.74)');cg2.addColorStop(.75,'rgba(36,78,40,0.82)');cg2.addColorStop(1,'rgba(20,50,24,0.90)');
  bx.fillStyle=cg2;bx.beginPath();bx.arc(cx,cy,coinR,0,Math.PI*2);bx.fill();
  bx.globalCompositeOperation='screen';
  const sg=bx.createRadialGradient(cx-coinR*.2,cy-coinR*.3,0,cx,cy,coinR*.9);
  sg.addColorStop(0,'rgba(75,135,78,0.18)');sg.addColorStop(.6,'rgba(35,75,38,0.06)');sg.addColorStop(1,'rgba(0,0,0,0)');
  bx.fillStyle=sg;bx.beginPath();bx.arc(cx,cy,coinR,0,Math.PI*2);bx.fill();
  bx.globalCompositeOperation='source-over';
  const fg=bx.createRadialGradient(cx,cy,coinR*.72,cx,cy,coinR);
  fg.addColorStop(0,'rgba(0,0,0,0)');fg.addColorStop(.4,'rgba(8,22,10,0.28)');fg.addColorStop(.75,'rgba(10,28,12,0.62)');fg.addColorStop(1,'rgba(12,32,14,0.90)');
  bx.fillStyle=fg;bx.beginPath();bx.arc(cx,cy,coinR,0,Math.PI*2);bx.fill();
  bx.restore();
  bx.beginPath();bx.arc(cx,cy,coinR+1.5,0,Math.PI*2);bx.strokeStyle='rgba(2,10,4,.72)';bx.lineWidth=2.8;bx.stroke();
  bx.beginPath();bx.arc(cx,cy,coinR+4.5,0,Math.PI*2);bx.strokeStyle='rgba(2,10,4,.32)';bx.lineWidth=1.1;bx.stroke();
  bx.beginPath();bx.arc(cx,cy,coinR-3,0,Math.PI*2);bx.strokeStyle='rgba(55,110,58,.22)';bx.lineWidth=.6;bx.stroke();
  bx.font=`700 ${coinR*.28}px ${FONT}`;bx.textBaseline='middle';
  [['S',cx-coinR*.68],['C',cx+coinR*.68]].forEach(([ch,lx])=>{bx.textAlign='center';bx.fillStyle='rgba(0,4,1,.65)';bx.fillText(ch,lx+.6,cy+coinR*.74+1.5);bx.fillStyle='rgba(62,120,65,.18)';bx.fillText(ch,lx-.3,cy+coinR*.74-.6);bx.fillStyle='rgba(22,55,26,.33)';bx.fillText(ch,lx,cy+coinR*.74);});
}

function drawRelief(){
  drawBustMedallion();
}

const CR=22;
function drawCrevices(t2){
  if(shimActive){shimT+=.012;if(shimT<4){const sweep=(shimT%2)/2;POS.forEach(([fx,fy])=>{const x=fx*W,y=fy*H,dist=Math.abs(fx-sweep);const sa=Math.max(0,1-dist*5)*.65;if(sa<.005)return;ox.beginPath();ox.arc(x,y,CR*1.6,0,Math.PI*2);const sg=ox.createRadialGradient(x-CR*.3,y-CR*.3,0,x,y,CR*1.6);sg.addColorStop(0,`rgba(140,205,128,${sa*.52})`);sg.addColorStop(.5,`rgba(95,155,85,${sa*.18})`);sg.addColorStop(1,'rgba(75,125,68,0)');ox.fillStyle=sg;ox.fill();});}else{shimActive=false;document.getElementById('hint').style.opacity='0';}}
  POS.forEach(([fx,fy],i)=>{
    const x=fx*W,y=fy*H,isA=i===ci,isH=i===hi,bA=isA?.28:isH?.17:.065;
    const sdg=ox.createRadialGradient(x+CR*.22,y+CR*.22,0,x,y,CR*1.22);sdg.addColorStop(0,`rgba(1,5,2,${bA*2.6})`);sdg.addColorStop(.5,`rgba(3,10,4,${bA})`);sdg.addColorStop(1,'rgba(1,5,2,0)');ox.fillStyle=sdg;ox.beginPath();ox.ellipse(x,y,CR*1.22,CR*.92,0,0,Math.PI*2);ox.fill();
    const ivg=ox.createRadialGradient(x-CR*.22,y-CR*.18,0,x,y,CR*.8);ivg.addColorStop(0,`rgba(0,3,1,${bA*4.5})`);ivg.addColorStop(.45,`rgba(2,7,3,${bA*2.8})`);ivg.addColorStop(.82,`rgba(6,16,8,${bA})`);ivg.addColorStop(1,'rgba(6,16,8,0)');ox.fillStyle=ivg;ox.beginPath();ox.ellipse(x,y,CR*.8,CR*.62,Math.PI*.12,0,Math.PI*2);ox.fill();
    ox.beginPath();ox.ellipse(x,y-CR*.29,CR*.41,CR*.095,-.09,0,Math.PI*2);ox.fillStyle=`rgba(90,158,82,${isA?.14:isH?.09:.025})`;ox.fill();
    const fs=CR*1.224,font=`700 ${fs}px ${FONT}`;
    const lx=x,ly=y+CR*.05;ox.font=font;ox.textAlign='center';ox.textBaseline='middle';
    if(isA){ox.fillStyle='rgba(0,4,1,.82)';ox.fillText(SCALES[i].n,lx+1.4,ly+2.2);ox.fillStyle='rgba(2,8,3,.45)';ox.fillText(SCALES[i].n,lx+.6,ly+.9);ox.fillStyle='rgba(120,198,105,.25)';ox.fillText(SCALES[i].n,lx-.5,ly-.9);ox.shadowColor='rgba(80,208,68,.55)';ox.shadowBlur=10;ox.fillStyle=`rgba(135,230,108,${.88+Math.sin(t2*1.9)*.12})`;ox.fillText(SCALES[i].n,lx,ly);ox.shadowBlur=0;ox.shadowColor='transparent';}
    else if(isH){ox.fillStyle='rgba(0,4,1,.65)';ox.fillText(SCALES[i].n,lx+1.2,ly+1.8);ox.fillStyle='rgba(105,172,90,.22)';ox.fillText(SCALES[i].n,lx-.4,ly-.7);ox.fillStyle='rgba(110,185,95,.72)';ox.fillText(SCALES[i].n,lx,ly);}
    else{ox.fillStyle='rgba(0,4,1,.55)';ox.fillText(SCALES[i].n,lx+1,ly+1.6);ox.fillStyle='rgba(100,168,82,.22)';ox.fillText(SCALES[i].n,lx-.4,ly-.6);ox.fillStyle='rgba(82,148,68,.58)';ox.fillText(SCALES[i].n,lx,ly);}
  });
  if(ci>=0){const[fx,fy]=POS[ci];const x=fx*W,y=fy*H,lY=fy>.78?y-CR*2.6:y+CR*2.0;ox.font=`600 ${CR*.28}px ${FONT}`;ox.textAlign='center';ox.textBaseline='top';ox.fillStyle='rgba(0,4,1,.55)';ox.fillText(SCALES[ci].label,x+.5,lY+1);ox.fillStyle='rgba(118,200,100,.60)';ox.fillText(SCALES[ci].label,x,lY);}
}

function loop(){T+=.016;wx.clearRect(0,0,W,H);ox.clearRect(0,0,W,H);drawStream(T);drawCrevices(T);requestAnimationFrame(loop);}
function hitTest(ex,ey){const rect=document.getElementById('scene').getBoundingClientRect();const scl=W/rect.width,mx=(ex-rect.left)*scl,my=(ey-rect.top)*scl;for(let i=0;i<7;i++){const[fx,fy]=POS[i];if(Math.hypot(mx-fx*W,my-fy*H)<CR*1.35)return i;}return -1;}
const hlEl=document.getElementById('hl');
hlEl.addEventListener('mousemove',e=>{const i=hitTest(e.clientX,e.clientY);hi=i;hlEl.style.cursor=i>=0?'pointer':'crosshair';document.getElementById('stlbl').textContent=i>=0?SCALES[i].label:'';});
hlEl.addEventListener('mouseleave',()=>{hi=-1;document.getElementById('stlbl').textContent='';});
hlEl.addEventListener('click',e=>{const i=hitTest(e.clientX,e.clientY);if(i<0){stopA();return;}const prev=ci;ci=i;if(i!==prev){upTop(i);stTim();}startStream(i);play(i);});
hlEl.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];const i=hitTest(t.clientX,t.clientY);if(i<0){stopA();return;}ci=i;upTop(i);stTim();startStream(i);},{passive:false});
window.addEventListener('resize',setD);
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
(async()=>{
  [stonePat,bustImg,algaeImg]=await Promise.all([loadImg(TEX_B64,'jpeg'),loadImg(BUST_B64,'jpeg'),loadImg(ALGAE_B64,'jpeg')]);
  setD();loop();
})();
</script>
