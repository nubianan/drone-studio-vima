<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Drone Studio" />
  <meta name="theme-color" content="#0e1a14" />
  <title>Drone Studio</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0e1a14;
      color: #e7f0dc;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    #app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 18% 15%, rgba(144, 196, 118, 0.18), transparent 28%),
        radial-gradient(circle at 80% 72%, rgba(164, 107, 68, 0.14), transparent 34%),
        linear-gradient(180deg, #0e1a14 0%, #07110b 100%);
    }

    #top {
      flex-shrink: 0;
      min-height: 56px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(8, 18, 10, 0.97);
      border-bottom: 1px solid rgba(120, 170, 95, 0.14);
      z-index: 10;
    }

    #dot {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
      border-radius: 999px;
      background: rgba(120, 170, 95, 0.28);
      transition: background 0.2s ease;
    }

    #dot.playing {
      background: #b8e58b;
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.9); opacity: 0.36; }
    }

    #status {
      flex: 1;
      min-width: 0;
    }

    #statusLabel {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(169, 215, 139, 0.48);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #nowPlaying {
      display: none;
      margin-top: 2px;
      font-size: 13px;
      color: #dcebcf;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    #timer {
      display: none;
      min-width: 55px;
      text-align: right;
      font-size: 11px;
      color: rgba(169, 215, 139, 0.45);
      font-variant-numeric: tabular-nums;
    }

    .controlButton {
      border: 1px solid rgba(130, 185, 100, 0.2);
      background: rgba(130, 185, 100, 0.06);
      color: rgba(195, 235, 165, 0.76);
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.18s ease;
      -webkit-appearance: none;
    }

    .controlButton:hover {
      background: rgba(130, 185, 100, 0.12);
      color: #e7f6d9;
    }

    .controlButton.active {
      border-color: rgba(184, 229, 139, 0.55);
      color: #c7f09d;
      background: rgba(130, 185, 100, 0.15);
    }

    #stopButton {
      display: none;
      border-color: rgba(210, 130, 80, 0.28);
      color: rgba(230, 172, 125, 0.86);
      background: rgba(210, 100, 70, 0.08);
    }

    #stopButton.visible {
      display: inline-block;
    }

    #scene {
      position: relative;
      flex: 1;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    #backgroundCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.95;
    }

    #panel {
      position: relative;
      z-index: 2;
      width: min(760px, 100%);
      padding: 24px;
      border-radius: 30px;
      border: 1px solid rgba(198, 235, 160, 0.12);
      background: rgba(7, 17, 11, 0.72);
      backdrop-filter: blur(12px);
      box-shadow: 0 28px 110px rgba(0, 0, 0, 0.36);
    }

    #eyebrow {
      margin-bottom: 8px;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(184, 229, 139, 0.46);
    }

    h1 {
      font-size: clamp(30px, 6vw, 56px);
      line-height: 0.92;
      letter-spacing: -0.06em;
      font-weight: 650;
      color: #eef7e5;
    }

    #instructions {
      margin-top: 12px;
      margin-bottom: 22px;
      max-width: 56ch;
      font-size: 14px;
      line-height: 1.48;
      color: rgba(222, 238, 205, 0.68);
    }

    code {
      color: #c7f09d;
      background: rgba(184, 229, 139, 0.08);
      padding: 1px 5px;
      border-radius: 6px;
    }

    #scaleGrid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
    }

    .scaleButton {
      width: 100%;
      aspect-ratio: 1 / 1;
      min-height: 92px;
      border-radius: 24px;
      border: 1px solid rgba(198, 235, 160, 0.14);
      background:
        radial-gradient(circle at 33% 20%, rgba(240, 255, 210, 0.13), transparent 34%),
        rgba(130, 160, 95, 0.1);
      color: #e7f0dc;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .scaleButton:hover {
      transform: translateY(-2px);
      border-color: rgba(198, 235, 160, 0.34);
      background:
        radial-gradient(circle at 33% 20%, rgba(240, 255, 210, 0.22), transparent 34%),
        rgba(130, 160, 95, 0.16);
    }

    .scaleButton.active {
      border-color: rgba(198, 235, 160, 0.8);
      background:
        radial-gradient(circle at 33% 20%, rgba(240, 255, 210, 0.31), transparent 34%),
        rgba(140, 190, 95, 0.24);
      box-shadow: 0 0 0 1px rgba(198, 235, 160, 0.12), 0 20px 70px rgba(148, 205, 105, 0.18);
    }

    .scaleLetter {
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1;
      font-weight: 700;
    }

    .scaleLabel {
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(222, 238, 205, 0.58);
    }

    #bottom {
      flex-shrink: 0;
      min-height: 42px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(8, 18, 10, 0.97);
      border-top: 1px solid rgba(120, 170, 95, 0.1);
      z-index: 10;
    }

    #hint,
    #fileStatus {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(169, 215, 139, 0.34);
    }

    #fileStatus {
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 780px) {
      #scene {
        padding: 14px;
      }

      #panel {
        padding: 18px;
        border-radius: 24px;
      }

      #scaleGrid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 480px) {
      #top {
        align-items: flex-start;
      }

      #controls {
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      #timer {
        display: none !important;
      }

      #scaleGrid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .scaleButton {
        min-height: 108px;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <header id="top">
      <div id="dot"></div>

      <div id="status">
        <div id="statusLabel">Tap a scale to begin</div>
        <div id="nowPlaying"></div>
      </div>

      <div id="controls">
        <span id="timer"></span>
        <button id="sustainButton" class="controlButton" type="button">Sustain</button>
        <button id="stopButton" class="controlButton" type="button">Stop</button>
      </div>
    </header>

    <main id="scene">
      <canvas id="backgroundCanvas"></canvas>

      <section id="panel" aria-label="Seven scale drone player">
        <div id="eyebrow">Drone Studio</div>
        <h1>Seven Scale Drone Player</h1>
        <p id="instructions">
          Put your seven audio files in an <code>audio</code> folder beside this file. Then click a scale button to play the matching drone.
        </p>

        <div id="scaleGrid"></div>
      </section>
    </main>

    <footer id="bottom">
      <span id="hint">One scale plays at a time</span>
      <span id="fileStatus">audio folder required</span>
    </footer>
  </div>

  <script>
    'use strict';

    /**************************************************************
     * CHANGE ONLY THIS SECTION IF YOUR FILE NAMES ARE DIFFERENT.
     *
     * GitHub repo structure should be:
     *
     *   index.html
     *   audio/
     *     a-minor.mp3
     *     b-minor.mp3
     *     c-minor.mp3
     *     d-minor.mp3
     *     e-minor.mp3
     *     f-minor.mp3
     *     g-minor.mp3
     **************************************************************/

    const SCALES = [
      { note: 'A', name: 'A Minor', file: 'audio/a-minor.mp3' },
      { note: 'B', name: 'B Minor', file: 'audio/b-minor.mp3' },
      { note: 'C', name: 'C Minor', file: 'audio/c-minor.mp3' },
      { note: 'D', name: 'D Minor', file: 'audio/d-minor.mp3' },
      { note: 'E', name: 'E Minor', file: 'audio/e-minor.mp3' },
      { note: 'F', name: 'F Minor', file: 'audio/f-minor.mp3' },
      { note: 'G', name: 'G Minor', file: 'audio/g-minor.mp3' }
    ];

    /**************************************************************
     * APP LOGIC. YOU SHOULD NOT NEED TO CHANGE BELOW THIS LINE.
     **************************************************************/

    const dot = document.getElementById('dot');
    const statusLabel = document.getElementById('statusLabel');
    const nowPlaying = document.getElementById('nowPlaying');
    const timer = document.getElementById('timer');
    const stopButton = document.getElementById('stopButton');
    const sustainButton = document.getElementById('sustainButton');
    const scaleGrid = document.getElementById('scaleGrid');
    const fileStatus = document.getElementById('fileStatus');
    const canvas = document.getElementById('backgroundCanvas');
    const ctx = canvas.getContext('2d');

    let currentAudio = null;
    let currentIndex = -1;
    let sustainOn = false;
    let timerId = null;
    let startedAt = 0;
    let animationId = null;

    function buildScaleButtons() {
      SCALES.forEach((scale, index) => {
        const button = document.createElement('button');
        button.className = 'scaleButton';
        button.type = 'button';
        button.dataset.index = String(index);
        button.setAttribute('aria-label', `Play ${scale.name}`);
        button.innerHTML = `
          <span class="scaleLetter">${scale.note}</span>
          <span class="scaleLabel">${scale.name}</span>
        `;

        button.addEventListener('click', () => {
          playScale(index);
        });

        scaleGrid.appendChild(button);
      });
    }

    function playScale(index) {
      const scale = SCALES[index];

      if (!scale) return;

      stopAudio(false);

      const audio = new Audio();
      audio.src = scale.file;
      audio.preload = 'auto';
      audio.loop = sustainOn;
      audio.volume = 1;

      currentAudio = audio;
      currentIndex = index;

      setLoadingState(scale);

      audio.addEventListener('canplay', () => {
        if (currentAudio === audio) {
          fileStatus.textContent = scale.file;
        }
      });

      audio.addEventListener('ended', () => {
        if (currentAudio === audio && !sustainOn) {
          stopAudio(true);
        }
      });

      audio.addEventListener('error', () => {
        if (currentAudio !== audio) return;

        const message = getAudioErrorMessage(audio);
        setErrorState(scale, message);
        stopAudio(false);
      });

      audio.play()
        .then(() => {
          if (currentAudio === audio) {
            setPlayingState(scale, index);
          }
        })
        .catch((error) => {
          console.error(error);
          setErrorState(scale, error.message || 'Playback failed');
          stopAudio(false);
        });
    }

    function stopAudio(resetStatus = true) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio.src = '';
        currentAudio.load();
      }

      currentAudio = null;
      currentIndex = -1;
      stopTimer();
      clearActiveButtons();

      dot.classList.remove('playing');
      stopButton.classList.remove('visible');
      timer.style.display = 'none';
      timer.textContent = '';

      if (resetStatus) {
        statusLabel.textContent = 'Tap a scale to begin';
        nowPlaying.style.display = 'none';
        nowPlaying.textContent = '';
        fileStatus.textContent = 'audio folder required';
      }
    }

    function setLoadingState(scale) {
      statusLabel.textContent = 'Loading audio';
      nowPlaying.textContent = scale.name;
      nowPlaying.style.display = 'block';
      fileStatus.textContent = scale.file;
    }

    function setPlayingState(scale, index) {
      statusLabel.textContent = 'Now playing';
      nowPlaying.textContent = scale.name;
      nowPlaying.style.display = 'block';
      dot.classList.add('playing');
      stopButton.classList.add('visible');
      timer.style.display = 'inline';

      clearActiveButtons();
      const activeButton = document.querySelector(`.scaleButton[data-index="${index}"]`);
      if (activeButton) activeButton.classList.add('active');

      startTimer();
    }

    function setErrorState(scale, message) {
      statusLabel.textContent = 'Could not play audio';
      nowPlaying.textContent = `${scale.name} — check ${scale.file}`;
      nowPlaying.style.display = 'block';
      fileStatus.textContent = message;
    }

    function clearActiveButtons() {
      document.querySelectorAll('.scaleButton').forEach((button) => {
        button.classList.remove('active');
      });
    }

    function getAudioErrorMessage(audio) {
      if (!audio.error) return 'Unknown audio error';

      switch (audio.error.code) {
        case MediaError.MEDIA_ERR_ABORTED:
          return 'Audio load was aborted';
        case MediaError.MEDIA_ERR_NETWORK:
          return 'Network error loading audio';
        case MediaError.MEDIA_ERR_DECODE:
          return 'Audio format could not be decoded';
        case MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED:
          return 'File missing or format not supported';
        default:
          return 'Unknown audio error';
      }
    }

    function startTimer() {
      stopTimer();
      startedAt = Date.now();
      updateTimer();
      timerId = window.setInterval(updateTimer, 1000);
    }

    function stopTimer() {
      if (timerId) {
        window.clearInterval(timerId);
        timerId = null;
      }
    }

    function updateTimer() {
      const elapsed = Math.floor((Date.now() - startedAt) / 1000);
      const minutes = Math.floor(elapsed / 60);
      const seconds = elapsed % 60;
      timer.textContent = `${minutes}:${String(seconds).padStart(2, '0')}`;
    }

    sustainButton.addEventListener('click', () => {
      sustainOn = !sustainOn;
      sustainButton.classList.toggle('active', sustainOn);
      sustainButton.textContent = sustainOn ? 'Sustain on' : 'Sustain';

      if (currentAudio) {
        currentAudio.loop = sustainOn;
      }
    });

    stopButton.addEventListener('click', () => {
      stopAudio(true);
    });

    function resizeCanvas() {
      const pixelRatio = window.devicePixelRatio || 1;
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      canvas.width = Math.floor(width * pixelRatio);
      canvas.height = Math.floor(height * pixelRatio);
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }

    function drawBackground(time = 0) {
      resizeCanvas();

      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      ctx.clearRect(0, 0, width, height);

      const gradient = ctx.createRadialGradient(
        width * 0.5,
        height * 0.45,
        20,
        width * 0.5,
        height * 0.5,
        Math.max(width, height) * 0.78
      );

      gradient.addColorStop(0, 'rgba(65, 98, 54, 0.38)');
      gradient.addColorStop(0.46, 'rgba(17, 34, 21, 0.86)');
      gradient.addColorStop(1, 'rgba(5, 11, 7, 1)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      ctx.save();
      ctx.globalAlpha = currentAudio ? 0.22 : 0.12;
      ctx.strokeStyle = 'rgba(221, 242, 194, 0.52)';
      ctx.lineWidth = 1;

      const lineCount = 28;
      for (let i = 0; i < lineCount; i++) {
        const y = (height / (lineCount - 1)) * i;
        const wave = Math.sin(time * 0.0006 + i * 0.52) * (currentAudio ? 18 : 8);

        ctx.beginPath();
        for (let x = -30; x <= width + 30; x += 24) {
          const yy = y + wave + Math.sin(x * 0.015 + time * 0.0008 + i) * 8;
          if (x === -30) ctx.moveTo(x, yy);
          else ctx.lineTo(x, yy);
        }
        ctx.stroke();
      }

      if (currentAudio) {
        const centerX = width / 2;
        const centerY = height / 2;
        const radius = Math.min(width, height) * 0.16 + Math.sin(time * 0.002) * 9;

        ctx.globalAlpha = 0.5;
        ctx.strokeStyle = 'rgba(198, 235, 160, 0.68)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();

        const points = 96;
        for (let i = 0; i <= points; i++) {
          const angle = (Math.PI * 2 * i) / points;
          const wobble = Math.sin(time * 0.0015 + i * 0.35) * 14;
          const r = radius + wobble;
          const x = centerX + Math.cos(angle) * r;
          const y = centerY + Math.sin(angle) * r;

          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        ctx.closePath();
        ctx.stroke();
      }

      ctx.restore();

      animationId = window.requestAnimationFrame(drawBackground);
    }

    window.addEventListener('resize', resizeCanvas);

    buildScaleButtons();
    resizeCanvas();
    drawBackground();
  </script>
</body>
</html>
